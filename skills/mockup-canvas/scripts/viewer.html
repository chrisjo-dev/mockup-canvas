    if (typeof t.selector === 'string' && t.selector) {
      s += ' -> ' + t.selector.replace(/\s+/g, ' ');
      if (typeof t.text === 'string' && t.text) s += ' ' + pinQuote(t.text.slice(0, 60));
    } else if (box) s += ' at ' + box.x + ',' + box.y + (box.w || box.h ? ' ' + box.w + 'x' + box.h : '');
    return s + ' (see canvas pins)';
  }
  function closePin() {
    if (pinPop.hidden) return;
    pinPop.hidden = true; pinPop.textContent = '';
    const was = pinOpen;
    pinOpen = null;
    const r = was && recs[was.file];
    if (r && r.pins) for (const m of r.pins.querySelectorAll('.pin.sel')) m.classList.remove('sel');
  }
  function openPin(file, id) {
    const b = canvasData && canvasData.boards[file];
    const hit = b && pinList(b).find(([, c]) => c.id === id);
    if (!hit) { closePin(); return; }
    const [n, c] = hit;
    closeComments(); closeBoardMenu();
    pinOpen = { file, id };
    const r = recs[file];
    if (r && r.pins) {
      for (const m of r.pins.querySelectorAll('.pin')) m.classList.toggle('sel', m.textContent === String(n));
    }
    const st = pinState(c);
    const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
    pinPop.textContent = '';
    const ph = el('div', 'ph');
    ph.appendChild(el('span', 'n' + (st && st !== 'wait' ? ' ' + st : ''), String(n)));
    ph.appendChild(el('b', '', 'Pin ' + n + (c.resolved ? ', resolved' : '')));
    ph.appendChild(el('span', 'm', [c.by, c.created].filter(v => v != null && v !== '').map(String).join(', ')));
    pinPop.appendChild(ph);
    pinPop.appendChild(el('div', 'tx', String(c.text == null ? '' : c.text)));
    const t = (c.target && typeof c.target === 'object') ? c.target : {};
    const sel = typeof t.selector === 'string' ? t.selector : '';
    if (c.state === 'pending') pinPop.appendChild(el('div', 'tg find', 'Finding the element under the pin...'));
    else if (c.state === 'lost') pinPop.appendChild(el('div', 'tg warn', 'The board changed and ' + (sel || 'the element') + ' is no longer there. The pin stays where it was.'));
    else if (c.state === 'none') pinPop.appendChild(el('div', 'tg warn', sel ? 'No element matches ' + sel + '.' : 'No element found under the pin.'));
    else if (sel) {
      const tg = el('div', 'tg');
      if (typeof c.img === 'string' && PIN_ID.test(c.img.replace(/\.png$/, ''))) {
        const img = el('img');
        img.alt = '';
        img.src = BASE + '/pins/' + encodeURIComponent(c.img) + '?v=' + encodeURIComponent(String(c.ver || ''));
        tg.appendChild(img);
      }
      tg.appendChild(el('div', 'sel', sel));
      const rc = t.rect && typeof t.rect === 'object' ? t.rect : null;
      const what = (typeof t.text === 'string' && t.text ? '"' + t.text.slice(0, 60) + '"' : '') +
        (rc ? (t.text ? ', ' : '') + num(rc.w, 0) + ' x ' + num(rc.h, 0) : '');
      if (what) tg.appendChild(el('div', 'et', what));
      pinPop.appendChild(tg);
    }
    if (c.resolved && typeof c.resolved === 'object' && c.resolved.note) pinPop.appendChild(el('div', 'tg note', 'Note: ' + String(c.resolved.note)));
    const ft = el('div', 'ft');
    const btn = (label, cls, run, html) => {
      const bt = el('button', cls);
      bt.type = 'button';
      if (html) bt.innerHTML = html;
      if (label) bt.appendChild(document.createTextNode(label));
      bt.addEventListener('click', run);
      ft.appendChild(bt);
      return bt;
    };
    const first = btn('Copy for AI', c.resolved ? '' : 'pri', () => {
      const text = pinCopyText(file, n, c);
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => showToast('Copied pin ' + n + ' for the AI'), () => showToast(text));
      else showToast(text);
    }, svgIcon('<rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 5.5V3.8A1.3 1.3 0 0 0 9.2 2.5H3.8A1.3 1.3 0 0 0 2.5 3.8v5.4a1.3 1.3 0 0 0 1.3 1.3h1.7"/>'));
    ft.appendChild(el('span', 'sp'));
    btn(c.resolved ? 'Reopen' : 'Resolve', 'ghost', async () => {
      const d = await post('/api/pin', Object.assign(scope(), { file, action: c.resolved ? 'reopen' : 'resolve', ref: c.id }));
      if (!d.ok) { showToast(d.error || 'Could not save the pin'); return; }
      await loadCanvas(true);
      openPin(file, c.id);
    });
    const del = btn('', 'ghost dg', async () => {
      const d = await post('/api/pin', Object.assign(scope(), { file, action: 'delete', ref: c.id }));
      if (!d.ok) { showToast(d.error || 'Could not delete the pin'); return; }
      closePin();
      await loadCanvas(true);
      const box = pinBox(c);
      showToast('Deleted pin ' + n, box ? { label: 'Undo', run: async () => {
        const a = await post('/api/pin', Object.assign(scope(), { file, action: 'add', text: c.text, at: box }));
        if (!a.ok) { showToast(a.error || 'Could not restore the pin'); return; }
        await loadCanvas(true);
      } } : undefined);
    }, TRASH_SVG);
    del.setAttribute('aria-label', 'Delete pin');
    pinPop.appendChild(ft);
    pinPop.hidden = false;
    placeNear(pinPop, file, pinBox(c) || { x: 0, y: 0, w: 0, h: 0 });
    first.focus({ preventScroll: true });
  }
  for (const p of [pinCmp, pinPop]) {
    p.addEventListener('mousedown', (e) => e.stopPropagation());
    p.addEventListener('wheel', (e) => e.stopPropagation(), { passive: true });
  }
  pinPop.addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closePin(); } });
  window.addEventListener('mousedown', () => { if (!pinPop.hidden) closePin(); });

  // ── Render arrows ────────────────────────────────────────────────────────
  function arrowGeometry(lnk, boards, all) {
    const fb = boards[lnk.from], tb = boards[lnk.to];
    let sx, sy, tx, ty, cx1, cy1, cx2, cy2;
    if (tb.x >= fb.x + fb.w) {
      // Forward: right edge -> left edge
      sx = fb.x + fb.w; sy = fb.y + fb.h / 2;
      tx = tb.x;        ty = tb.y + tb.h / 2;
      const off = Math.max(24, Math.abs(tx - sx) * 0.4);
      cx1 = sx + off; cy1 = sy; cx2 = tx - off; cy2 = ty;
    } else if (tb.y >= fb.y + fb.h || tb.y + tb.h <= fb.y) {
      // Vertical: bottom edge -> top edge (or top -> bottom when the target is above)
      const down = tb.y >= fb.y + fb.h;
      sx = fb.x + fb.w / 2; sy = down ? fb.y + fb.h : fb.y;
      tx = tb.x + tb.w / 2; ty = down ? tb.y : tb.y + tb.h;
      const off = Math.max(24, Math.abs(ty - sy) * 0.4) * (down ? 1 : -1);
      cx1 = sx; cy1 = sy + off; cx2 = tx; cy2 = ty - off;
    } else {
      // Backward on the same row: leave the bottom edge, pass below every board in between, enter the bottom edge
      sx = fb.x + fb.w / 2; sy = fb.y + fb.h;
      tx = tb.x + tb.w / 2; ty = tb.y + tb.h;
      const left = Math.min(fb.x, tb.x), right = Math.max(fb.x + fb.w, tb.x + tb.w);
      let low = Math.max(sy, ty);
      for (const b of all) {
        if (b.x < right && b.x + b.w > left) low = Math.max(low, b.y + b.h);
      }
      low += 60;
      // A cubic with both control points at y=c bottoms out at 0.25*start + 0.75*c
      const c = (low - 0.25 * Math.max(sy, ty)) / 0.75;
      cx1 = sx; cy1 = c; cx2 = tx; cy2 = c;
    }
    return { d: `M${sx},${sy} C${cx1},${cy1} ${cx2},${cy2} ${tx},${ty}`,
             // cubic bezier midpoint at t=0.5
             mx: 0.125*sx + 0.375*cx1 + 0.375*cx2 + 0.125*tx,
             my: 0.125*sy + 0.375*cy1 + 0.375*cy2 + 0.125*ty };
  }

  function renderArrows() {
    while (arrowSvg.lastChild) arrowSvg.removeChild(arrowSvg.lastChild);
    arrowEls = [];
    arrowSvg.classList.toggle('hidden', !showArrows);
    if (!showArrows || !canvasData) return;
    const { boards = {}, links = [] } = canvasData;
    if (!links.length) return;

    const NS = 'http://www.w3.org/2000/svg';
    // Chrome skips zero-sized SVGs, so size it to cover every artboard
    const all = Object.values(boards);
    const x1 = Math.min(...all.map(b => b.x)) - 400, y1 = Math.min(...all.map(b => b.y)) - 400;
    const x2 = Math.max(...all.map(b => b.x + b.w)) + 400, y2 = Math.max(...all.map(b => b.y + b.h)) + 400;
    arrowSvg.style.left = x1 + 'px'; arrowSvg.style.top = y1 + 'px';
    arrowSvg.style.width = (x2 - x1) + 'px'; arrowSvg.style.height = (y2 - y1) + 'px';
    arrowSvg.setAttribute('viewBox', `${x1} ${y1} ${x2 - x1} ${y2 - y1}`);
    const defs = document.createElementNS(NS, 'defs');
    defs.innerHTML =
      '<marker id="ah" markerWidth="8" markerHeight="6" refX="7" refY="3" ' +
      'orient="auto" markerUnits="strokeWidth">' +
      '<path d="M0,0 L0,6 L8,3 z" fill="#ffb547"/></marker>';
    arrowSvg.appendChild(defs);

    for (const lnk of links) {
      if (!boards[lnk.from] || !boards[lnk.to]) continue;
      const g = arrowGeometry(lnk, boards, all);
      const path = document.createElementNS(NS, 'path');
      path.setAttribute('d', g.d);
      path.setAttribute('stroke', '#ffb547');
      path.setAttribute('stroke-width', '3');
      path.setAttribute('fill', 'none');
      path.setAttribute('marker-end', 'url(#ah)');
      arrowSvg.appendChild(path);

      let txt = null;
      if (lnk.label) {
        txt = document.createElementNS(NS, 'text');
        txt.setAttribute('x', g.mx);
        txt.setAttribute('y', g.my - 6);
        txt.setAttribute('fill', '#ffb547');
        txt.setAttribute('font-size', '14');
        txt.setAttribute('font-weight', '700');
        txt.setAttribute('stroke', '#1e1e1e');
        txt.setAttribute('stroke-width', '4');
        txt.setAttribute('paint-order', 'stroke');
        txt.setAttribute('font-family', '-apple-system, sans-serif');
        txt.setAttribute('text-anchor', 'middle');
        txt.textContent = lnk.label;
        arrowSvg.appendChild(txt);
      }
      arrowEls.push({ lnk, path, text: txt });
    }
  }

  // While dragging, only the arrows that touch the dragged board move
  function updateArrowsFor(file) {
    if (!showArrows || !arrowEls.length) return;
    const boards = canvasData.boards, all = Object.values(boards);
    for (const a of arrowEls) {
      if (a.lnk.from !== file && a.lnk.to !== file) continue;
      const g = arrowGeometry(a.lnk, boards, all);
      a.path.setAttribute('d', g.d);
      if (a.text) { a.text.setAttribute('x', g.mx); a.text.setAttribute('y', g.my - 6); }
    }
  }

  // ── Comment panel ────────────────────────────────────────────────────────
  const cmtPanel = document.getElementById('cmt-panel');
  function closeComments() { cmtPanel.hidden = true; cmtPanel.textContent = ''; }
  function openComments(file, anchor) {
    const b = canvasData && canvasData.boards[file];
    if (!b) return;
    cmtPanel.textContent = '';
    const head = document.createElement('div');
    head.className = 'cmt-head';
    const ttl = document.createElement('span');
    ttl.textContent = file.replace('.html', '') + ' comments';
    const close = document.createElement('button');
    close.type = 'button';
    close.className = 'cmt-close';
    close.textContent = '\u00d7';
    close.setAttribute('aria-label', 'Close');
    close.addEventListener('click', closeComments);
    head.appendChild(ttl); head.appendChild(close);
    cmtPanel.appendChild(head);
    for (const c of b.comments) {
      const item = document.createElement('div');
      item.className = 'cmt-item';
      const meta = document.createElement('div');
      meta.className = 'cmt-meta';
      meta.textContent = [c.by, c.created].filter(v => v != null && v !== '').map(String).join(', ');
      const text = document.createElement('div');
      text.className = 'cmt-text';
      text.textContent = String(c.text == null ? '' : c.text);
      item.appendChild(meta); item.appendChild(text);
      cmtPanel.appendChild(item);
    }
    cmtPanel.hidden = false;
    const r = anchor.getBoundingClientRect();
    const pw = cmtPanel.offsetWidth, ph = cmtPanel.offsetHeight;
    cmtPanel.style.left = Math.max(12, Math.min(window.innerWidth - pw - 12, r.right - pw)) + 'px';
    cmtPanel.style.top = Math.max(12, Math.min(window.innerHeight - ph - 12, r.bottom + 6)) + 'px';
  }
  cmtPanel.addEventListener('mousedown', (e) => e.stopPropagation());
  cmtPanel.addEventListener('wheel', (e) => e.stopPropagation(), { passive: true });
  window.addEventListener('mousedown', () => { if (!cmtPanel.hidden) closeComments(); });

  function toggleGroup(gid) {
    if (collapsed.has(gid)) collapsed.delete(gid);
    else collapsed.add(gid);
    renderAll();
  }

  // ── Fit to view ──────────────────────────────────────────────────────────
  function fitToView() {
    if (!canvasData) return;
    // #<board id> (from the dashboard's board tiles) fits that one board
    let focus = null;
    try { focus = decodeURIComponent(location.hash.slice(1)); } catch (_) {}
    const own = (k) => Object.prototype.hasOwnProperty.call(canvasData.boards, k) ? canvasData.boards[k] : null;   // not #__proto__
    const one = focus && (own(focus) || own(focus + '.html'));
    const bds = one ? [one] : Object.values(canvasData.boards || {});
    if (!bds.length) return;
    const minX = Math.min(...bds.map(b => b.x));
    const minY = Math.min(...bds.map(b => b.y));
    const maxX = Math.max(...bds.map(b => b.x + b.w));
    const maxY = Math.max(...bds.map(b => b.y + b.h));
    const cw = maxX - minX + 96, ch = maxY - minY + 120;
    const sw = SW, sh = SH;
    const ns = Math.min(sw / cw, sh / ch, OVERVIEW ? Infinity : 1);
    sc = Math.max(0.05, ns);
    vx = (sw - cw * sc) / 2 - minX * sc + 48 * sc;
    vy = (sh - ch * sc) / 2 - minY * sc + 60 * sc;
    applyXform();
  }

  // ── Mouse events ─────────────────────────────────────────────────────────
  stage.addEventListener('mousedown', (e) => {
    if (pinMode && e.button === 0 && !e.target.closest?.('.board-bar') && !e.target.closest?.('.pin')) {
      const bd = e.target.closest?.('.board');
      if (bd && !bd.classList.contains('collapsed') && startPin(e, bd)) { e.preventDefault(); return; }
    }
    if (e.target === stage || e.target === cvs ||
        e.target.closest?.('.grp-bg') || e.target.closest?.('.grp-hdr')) {
      if (e.button !== 0) return;
      panning = true;
      panRef = { x: e.clientX - vx, y: e.clientY - vy };
      stage.style.cursor = 'grabbing';
      e.preventDefault();
    }
  });

  window.addEventListener('mousemove', (e) => {
    if (pinDrag) { movePin(e); return; }
    if (panning) {
      vx = e.clientX - panRef.x;
      vy = e.clientY - panRef.y;
      applyXform();
    } else if (dragging) {
      const nx = dragging.ox + (e.clientX - dragging.sx) / sc;
      const ny = dragging.oy + (e.clientY - dragging.sy) / sc;
      dragging.x = nx; dragging.y = ny; dragging.dirty = true;
      const b = canvasData.boards[dragging.file];
      if (b) { b.x = nx; b.y = ny; }
      schedule();
    }
  });

  window.addEventListener('mouseup', async (e) => {
    if (pinDrag) { endPin(e); return; }
    panning = false;
    stage.style.cursor = '';
    if (!dragging) return;
    const { file, el, sx, sy, ox, oy } = dragging;
    dragging = null;
    el.style.transform = '';
    const dx = (e.clientX - sx) / sc;
    const dy = (e.clientY - sy) / sc;
    const nx = Math.round(ox + dx);
    const ny = Math.round(oy + dy);
    if (Math.abs(dx) < 2 && Math.abs(dy) < 2) {
      const b = canvasData.boards[file];
      if (b) { b.x = ox; b.y = oy; }
      el.style.left = ox + 'px'; el.style.top = oy + 'px';
      return;
    }
    undoStack.push({ file, ox, oy, nx, ny });
    if (undoStack.length > 100) undoStack.shift();
    redoStack.length = 0;
    await moveBoard(file, nx, ny);
  });

  // ── Undo (artboard moves) ────────────────────────────────────────────────
  const undoStack = [], redoStack = [];

  async function moveBoard(file, x, y) {
    const b = canvasData.boards[file];
    if (!b) return;
    b.x = x; b.y = y;
    const r = recs[file];
    if (r) { r.div.style.left = x + 'px'; r.div.style.top = y + 'px'; }
    renderArrows();
    visDirty = true; schedule();
    try {
      const resp = await fetch(BASE + '/api/layout', {
        method: 'POST',
        // The server checks this exact Content-Type and the browser-sent Origin
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ board: file, x, y })
      });
      if (!resp.ok) showToast('Could not save position (' + resp.status + ')');
    } catch (_) {
      showToast('Could not save position: server disconnected');
    }
  }

  async function undoMove(redo) {
    const from = redo ? redoStack : undoStack, to = redo ? undoStack : redoStack;
    const m = from.pop();
    if (!m) { showToast(redo ? 'Nothing to redo' : 'Nothing to undo'); return; }
    to.push(m);
    const id = m.file.replace('.html', '');
    if (redo) { await moveBoard(m.file, m.nx, m.ny); showToast('Redo: ' + id); }
    else      { await moveBoard(m.file, m.ox, m.oy); showToast('Undo: ' + id); }
  }

  // Wheel zoom
  stage.addEventListener('wheel', (e) => {
    e.preventDefault();
    // Scale by delta so a mouse wheel (large deltas) and a trackpad (many small deltas) zoom at the same speed
    const dy = e.deltaMode === 1 ? e.deltaY * 33 : e.deltaY;
    const factor = Math.exp(-dy * (e.ctrlKey ? 0.01 : 0.002));
    const ns = Math.max(0.04, Math.min(5, sc * factor));
    vx = e.clientX - (e.clientX - vx) * ns / sc;
    vy = e.clientY - (e.clientY - vy) * ns / sc;
    sc = ns;
    applyXform();
  }, { passive: false });

  // ── Touch (mobile) ───────────────────────────────────────────────────────
  let touchPan = null, pinchDist = null, pinchMid = null;

  stage.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      touchPan = { x: e.touches[0].clientX - vx, y: e.touches[0].clientY - vy };
      pinchDist = null;
    } else if (e.touches.length === 2) {
      touchPan = null;
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      pinchDist = Math.hypot(dx, dy);
      pinchMid = {
        x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
        y: (e.touches[0].clientY + e.touches[1].clientY) / 2
      };
    }
  }, { passive: true });

  stage.addEventListener('touchmove', (e) => {
    if (e.touches.length === 1 && touchPan) {
      e.preventDefault();
      vx = e.touches[0].clientX - touchPan.x;
      vy = e.touches[0].clientY - touchPan.y;
      applyXform();
    } else if (e.touches.length === 2 && pinchDist !== null) {
      e.preventDefault();
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.hypot(dx, dy);
      const factor = dist / pinchDist;
      const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      const my = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      const ns = Math.max(0.04, Math.min(5, sc * factor));
      vx = mx - (mx - vx) * ns / sc;
      vy = my - (my - vy) * ns / sc;
      sc = ns;
      pinchDist = dist;
      pinchMid = { x: mx, y: my };
      applyXform();
    }
  }, { passive: false });

  stage.addEventListener('touchend', () => {
    touchPan = null; pinchDist = null;
  }, { passive: true });

  // ── Keyboard ─────────────────────────────────────────────────────────────
  window.addEventListener('keydown', (e) => {
    if (e.target && (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT')) return;   // typing a pin note
    if (!delLayer.hidden || !boardMenu.hidden) {   // the dialog and the menu take the keys
      if (e.key === 'Escape') { e.preventDefault(); if (!delLayer.hidden) closeDelete(); else { const b = menuBtn; closeBoardMenu(); if (b) b.focus(); } }
      return;
    }
    if ((e.metaKey || e.ctrlKey) && (e.key === 'z' || e.key === 'Z')) {
      e.preventDefault();
      if (!READ_ONLY) undoMove(e.shiftKey);
      return;
    }
    if ((e.metaKey || e.ctrlKey) && (e.key === 'y' || e.key === 'Y')) {
      e.preventDefault();
      if (!READ_ONLY) undoMove(true);
      return;
    }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'Escape') { closeComments(); closePin(); if (pinDraft) cancelDraft(); else if (pinMode) setPinMode(false); }
    if (CAN_PIN && (e.key === 'c' || e.key === 'C')) { if (pinDraft) cancelDraft(); setPinMode(!pinMode); }
    if (CAN_PIN && (e.key === 'p' || e.key === 'P')) {
      pinsHidden = !pinsHidden;
      if (pinsHidden) closePin();
      renderAll();
      showToast(pinsHidden ? 'Pins hidden' : 'Pins shown');
    }
    if (e.key === 'f' || e.key === 'F') fitToView();
    if (e.key === 'l' || e.key === 'L') {
      showArrows = !showArrows;
      renderArrows();
      showToast(showArrows ? 'Arrows shown' : 'Arrows hidden');
    }
  });

  // ── SSE (server mode only) ───────────────────────────────────────────────
  // Changes arrive in bursts (an agent writing many boards, every saved drag), so they are
  // collected for a moment and applied once; only boards that show content reload.
  let changedBoards = new Set(), canvasChanged = false, sseTimer = 0;
  function flushChanges() {
    sseTimer = 0;
    for (const file of changedBoards) {
      const r = recs[file];
      if (!r) continue;
      r.ver++;
      if (r.thumbState) r.thumbState = 'stale';
      if (r.kind === 'live') mountLive(r);   // loads hidden over the old one, then replaces it
      else if (r.kind === 'thumb') {
        // Shows an old version (also off screen): ask for the new thumbnail now, and mount live
        // without the idle wait when it comes into view at a live zoom (r.stale)
        r.stale = true; r.fresh = null; r.loader = null;
        loadThumb(r);
        visDirty = true; schedule();
      }
    }
    changedBoards.clear();
    if (canvasChanged) { canvasChanged = false; loadCanvas(true); }
  }
  function onThumbReady(file) {
    const r = recs[file];
    if (!r || !r.thumbState) return;
    r.thumbState = 'stale';
    // Live now, or showing an old version: decode it in the background (also off screen)
    if (r.kind === 'live' || r.stale) requestThumb(r);
    if (r.kind !== 'live') { visDirty = true; schedule(); }
  }
  let es = null;
  function setupSSE() {
    if (STATIC) return;
    if (new URLSearchParams(window.location.search).get('static') === '1') return;
    if (es) es.close();
    es = new EventSource(BASE + '/api/events');
    es.onmessage = (e) => {
      try {
        const d = JSON.parse(e.data);
        if (d.type === 'board' && d.file) changedBoards.add(d.file);
        else if (d.type === 'canvas') canvasChanged = true;
        else if (d.type === 'thumb' && d.file) { onThumbReady(d.file); return; }
        else return;
        if (!sseTimer) sseTimer = setTimeout(flushChanges, 250);
      } catch (_) {}
    };
    es.onerror = () => { es.close(); setTimeout(setupSSE, 3000); };
  }

  // ── Start ────────────────────────────────────────────────────────────────
  // The dashboard's "N new" badge counts boards edited after the last visit to this idea
  function markVisit() { try { localStorage.setItem('mc:visit:' + BASE.replace(/^\/+/, ''), String(Date.now())); } catch (_) {} }
  if (!STATIC) { markVisit(); window.addEventListener('pagehide', markVisit); }
  applyXform();
  loadCanvas().then(() => {
    fitToView();
    document.getElementById('loading').classList.add('gone');
    setupSSE();
  }).catch((err) => {
    document.getElementById('loading').textContent = 'Failed to load: ' + err.message;
  });

})();
</script>
</body>
</html>
