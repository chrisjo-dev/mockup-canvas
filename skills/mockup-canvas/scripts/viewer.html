<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canvas</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden;
      background: #1e1e1e; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    body { user-select: none; touch-action: none; }

    #stage { position: fixed; inset: 0; overflow: hidden; cursor: default; }
    #canvas { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
    #canvas.layer { will-change: transform; }

    /* Groups */
    .grp-bg {
      position: absolute; border-radius: 14px; pointer-events: none;
    }
    .grp-hdr {
      position: absolute; display: flex; align-items: center; gap: 6px;
      font-size: 13px; font-weight: 700; cursor: pointer; padding: 2px 4px;
      border-radius: 6px; pointer-events: auto; white-space: nowrap;
    }
    .grp-hdr:hover { background: rgba(255,255,255,0.05); }
    .grp-arrow { font-size: 9px; opacity: 0.7; }

    /* Artboards */
    /* A board is a white card with its title until its content (live iframe or thumbnail) is shown */
    /* No blurred shadow: re-rastering 24px blurs on every board made zoom drop frames */
    .board { position: absolute; background: #fff; border-radius: 0 0 4px 4px;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.5), 0 6px 0 rgba(0,0,0,0.25); contain: layout style; }
    .board .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      padding: 24px; text-align: center; color: #9a9a9a; font-size: 28px; font-weight: 600;
      overflow: hidden; pointer-events: none; }
    /* Only decoded thumbnails are attached (see loadThumb), so no fade or opacity layer */
    .board img.thumb { position: absolute; left: 0; top: 0; width: 100%; height: 100%;
      border-radius: 0 0 4px 4px; pointer-events: none; }
    .board-bar {
      position: absolute; top: -30px; left: 0; right: 0; height: 28px;
      /* No backdrop-filter: it blurred only the flat canvas color behind the bar, and 70 blurred
         bars in the canvas layer cost WebKit about 20 FPS while panning */
      background: rgba(42,42,42,0.92);
      border-radius: 6px 6px 0 0;
      display: flex; align-items: center; padding: 0 8px; gap: 6px;
      cursor: grab; font-size: 11px; white-space: nowrap; overflow: hidden;
    }
    .board-bar:active { cursor: grabbing; }
    /* Far out the bar text is a few px tall and unreadable; drawing it on every board made
       WebKit drop frames while panning. The bar itself stays as the drag handle. */
    #canvas.far .board-bar > * { visibility: hidden; }
    /* The board shadow is under half a pixel this far out, and still cost WebKit paint time */
    #canvas.far .board { box-shadow: none; }
    .board-id {
      color: rgba(255,255,255,0.4); font-size: 10px; flex-shrink: 0;
      font-family: ui-monospace, monospace;
    }
    .board-title-text { color: rgba(255,255,255,0.85); overflow: hidden; text-overflow: ellipsis; }
    .board iframe {
      position: absolute; left: 0; top: 0; display: block; border: none;
      border-radius: 0 0 4px 4px;
      background: #fff; pointer-events: none;
    }
    /* A loading iframe stays hidden over the thumbnail (or the previous iframe) until it has
       painted, so a board never flashes white */
    .board iframe.pending { visibility: hidden; }
    .board.collapsed { background: none; box-shadow: none; }
    .board.collapsed iframe, .board.collapsed img.thumb, .board.collapsed .ph { display: none; }
    .board.collapsed .board-bar { border-radius: 6px; }

    /* Status badges */
    .status-badge {
      display: inline-block; width: 7px; height: 7px; border-radius: 50%;
      flex-shrink: 0; margin-right: 1px;
    }
    .status-badge.approved { background: #4caf50; }
    .status-badge.rejected { background: #888; }
    .board-title-text.rejected { text-decoration: line-through; opacity: 0.5; }

    /* Implementation and comment badges */
    .built-badge {
      flex-shrink: 0; background: #6d48d6; color: #fff; font-size: 9px; font-weight: 700;
      padding: 1px 5px; border-radius: 4px; text-transform: uppercase; letter-spacing: .04em;
    }
    .cmt-badge {
      flex-shrink: 0; margin-left: auto; display: inline-flex; align-items: center; gap: 3px;
      background: rgba(255,255,255,0.12); color: #fff; border: none; border-radius: 9px;
      padding: 1px 7px 1px 5px; font: 700 10px -apple-system, sans-serif; cursor: pointer;
    }
    .cmt-badge:hover { background: rgba(255,255,255,0.22); }
    .cmt-badge svg { width: 11px; height: 11px; fill: currentColor; }
    #cmt-panel {
      position: fixed; z-index: 1500; width: 300px; max-width: calc(100vw - 24px); max-height: 50vh;
      overflow: auto; background: #2a2a2a; color: #e0e0e0; border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px; box-shadow: 0 6px 28px rgba(0,0,0,0.55); padding: 10px 12px; font-size: 12px;
      user-select: text;
    }
    #cmt-panel[hidden] { display: none; }
    #cmt-panel .cmt-head { display: flex; justify-content: space-between; align-items: center;
      font-weight: 700; color: #fff; margin-bottom: 6px; gap: 8px; }
    #cmt-panel .cmt-close { background: none; border: none; color: #aaa; font-size: 16px; cursor: pointer; padding: 0 2px; }
    #cmt-panel .cmt-item { border-top: 1px solid rgba(255,255,255,0.08); padding: 6px 0; }
    #cmt-panel .cmt-meta { color: #888; font-size: 10px; margin-bottom: 2px; }
    #cmt-panel .cmt-text { white-space: pre-wrap; word-break: break-word; }

    /* Flow arrows */
    #arrow-svg {
      position: absolute; top: 0; left: 0; overflow: visible;
      pointer-events: none; z-index: 5; width: 0; height: 0;
    }
    #arrow-svg.hidden { display: none; }

    /* Toolbar */
    #toolbar {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
      background: rgba(28,28,28,0.88); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px; padding: 7px 18px;
      display: flex; align-items: center; gap: 12px;
      color: rgba(255,255,255,0.65); font-size: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.5);
      z-index: 1000; white-space: nowrap;
      max-width: calc(100vw - 16px); box-sizing: border-box;
    }
    #toolbar > * { flex-shrink: 0; }
    #toolbar .idea-name {
      color: #fff; font-weight: 700;
      flex-shrink: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    }
    /* Touch screens have no F or L key: hide the hints. Narrow screens get a tighter bar. */
    @media (hover: none) and (pointer: coarse) {
      #toolbar .key-hint { display: none; }
    }
    @media (max-width: 480px) {
      #toolbar { padding: 6px 12px; gap: 8px; bottom: 10px; }
    }
    #toolbar kbd {
      background: rgba(255,255,255,0.12); border-radius: 4px;
      padding: 1px 6px; font-size: 11px; color: rgba(255,255,255,0.8);
    }
    #toolbar .sep { color: rgba(255,255,255,0.15); }
    #toolbar .ro-badge {
      background: #f59e0b; color: #1a1a1a; font-size: 10px; font-weight: 700;
      padding: 2px 7px; border-radius: 4px; text-transform: uppercase; letter-spacing: .05em;
    }
    #zoom-lbl { color: rgba(255,255,255,0.45); font-size: 11px; min-width: 38px; text-align: right; }

    /* Toast */
    .toast {
      position: fixed; bottom: 56px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.82); color: #fff; padding: 7px 16px;
      border-radius: 18px; font-size: 12px; pointer-events: none;
      opacity: 0; transition: opacity 0.18s; z-index: 2000;
      max-width: 90vw; text-align: center;
    }
    .toast.on { opacity: 1; }

    /* Loading */
    #loading {
      position: fixed; inset: 0; background: #1e1e1e; z-index: 3000;
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.4); font-size: 14px;
    }
    #loading.gone { display: none; }
  </style>
</head>
<body>
<div id="loading">Loading...</div>
<div id="stage"><div id="canvas"><div id="grp-layer"></div><div id="board-layer"></div><svg id="arrow-svg" xmlns="http://www.w3.org/2000/svg"></svg></div></div>
<div id="toolbar">
  <span class="idea-name" id="idea-lbl"></span>
  <span class="sep key-hint">|</span>
  <span class="key-hint"><kbd>F</kbd> Fit</span>
  <span class="sep key-hint">|</span>
  <span class="key-hint"><kbd>L</kbd> Arrows</span>
  <span class="sep">|</span>
  <span id="zoom-lbl">35%</span>
  <span id="ro-badge" class="ro-badge" style="display:none">Read-only</span>
</div>
<div class="toast" id="toast"></div>
<div id="cmt-panel" hidden></div>

<script>
(function () {
  'use strict';

  // ── XSS escaping helper ─────────────────────────────────────────────────
  function escHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // Group colors go into style attributes: allow only plain color values
  const SAFE_COLOR = /^(#[0-9a-fA-F]{3,8}|[a-zA-Z]{3,30}|(rgb|rgba|hsl|hsla)\([0-9.,%\s/a-z+-]{1,60}\))$/;
  function safeColor(c, fallback) {
    return (typeof c === 'string' && SAFE_COLOR.test(c.trim()) && !/url|expression/i.test(c)) ? c.trim() : fallback;
  }

  // Board geometry is used in style strings: force numbers
  function num(v, fallback) {
    const n = Number(v);
    return Number.isFinite(n) ? n : fallback;
  }
  function normalize(data) {
    if (!data || typeof data !== 'object') data = {};
    const boards = (data.boards && typeof data.boards === 'object') ? data.boards : {};
    for (const b of Object.values(boards)) {
      if (!b || typeof b !== 'object') continue;
      b.x = num(b.x, 0); b.y = num(b.y, 0);
      b.w = num(b.w, 390); b.h = num(b.h, 844);
      b.comments = Array.isArray(b.comments) ? b.comments.filter(c => c && typeof c === 'object') : [];
      b.impl = (b.impl && typeof b.impl === 'object') ? b.impl : null;
    }
    data.boards = boards;
    if (!Array.isArray(data.groups)) data.groups = [];
    if (!Array.isArray(data.links)) data.links = [];
    return data;
  }

  // ── Setup ───────────────────────────────────────────────────────────────
  const STATIC = typeof STATIC_CANVAS !== 'undefined';
  const OVERVIEW = new URLSearchParams(location.search).get('overview') === '1';
  if (OVERVIEW) document.getElementById('toolbar').style.display = 'none';
  // BASE detection works for both single-root (/idea/) and registry (/<project>/<idea>/) paths
  const _pathParts = STATIC ? [] : window.location.pathname.replace(/\/+$/, '').split('/').filter(Boolean);
  const IDEA = STATIC ? '' : (_pathParts[_pathParts.length - 1] || '');
  const BASE = STATIC ? '' : ('/' + _pathParts.join('/'));
  const READ_ONLY = STATIC || !!window.CANVAS_READ_ONLY;
  // Share mode: sandboxed boards load their files through a keyed path (no cookie in an opaque origin)
  const ASSET_PREFIX = (!STATIC && typeof window.CANVAS_ASSET_PREFIX === 'string' &&
                        /^\/_k\/[0-9a-f]+$/.test(window.CANVAS_ASSET_PREFIX)) ? window.CANVAS_ASSET_PREFIX : '';
  function boardUrl(file) {
    return STATIC ? ('boards/' + encodeURIComponent(file)) : (ASSET_PREFIX + BASE + '/boards/' + encodeURIComponent(file));
  }
  if (READ_ONLY) {
    const badge = document.getElementById('ro-badge');
    if (badge) badge.style.display = '';
  }

  document.title = (IDEA || 'Exported canvas') + ' - Canvas';
  document.getElementById('idea-lbl').textContent = IDEA || 'Canvas';

  // ── State ────────────────────────────────────────────────────────────────
  let canvasData = null;
  let vx = 0, vy = 0, sc = 0.35;
  let panning = false, panRef = null;
  let dragging = null;  // {file, el, sx, sy, ox, oy, x, y, dirty}
  let collapsed = new Set();
  // file -> {file, div, bar, iframe, img, kind: 'none'|'live'|'thumb', ver, thumbState, hidden}
  let recs = {};
  let toastTimer = null;
  let showArrows = true;
  let arrowEls = [];   // one per drawn link: {lnk, path, text}

  const stage   = document.getElementById('stage');
  const cvs     = document.getElementById('canvas');
  const grpLayer = document.getElementById('grp-layer');
  const boardLayer = document.getElementById('board-layer');
  const arrowSvg = document.getElementById('arrow-svg');
  const toast   = document.getElementById('toast');
  const zoomLbl = document.getElementById('zoom-lbl');

  // Level of detail: zoomed out, boards show cached PNG thumbnails (server mode) instead of live
  // iframes; zoomed in, boards near the viewport get a live iframe. Between LIVE_OUT and LIVE_IN a
  // board keeps what it shows, so a small zoom around the threshold does not swap anything.
  // Loaded iframes stay (also off screen) up to LIVE_MAX boards or LIVE_AREA px; the least
  // recently seen go back to their thumbnail first. A board seen once never shows blank again:
  // its stand-in is its thumbnail, and an iframe is revealed only after it has painted.
  // The overview render needs every board live, so it keeps them all.
  // On a 2x screen a thumbnail looked blurry next to the live board from about 30% (a downscaled
  // PNG loses the crisp text of a page drawn at that size), so boards go live from 34% there.
  const HI_DPR = (window.devicePixelRatio || 1) >= 1.5;
  const LIVE_IN = HI_DPR ? 0.34 : 0.40, LIVE_OUT = HI_DPR ? 0.26 : 0.30;
  const LIVE_MAX = 16, LIVE_AREA = 16 * 390 * 844;
  // Boards within a quarter screen beyond the edges count as near: they mount (after the visible
  // ones have loaded) so a short pan finds them live, and a load still running there is kept
  const MARGIN = 0.25;
  // At most this many iframes are created per frame (each costs WebKit and Firefox 20 to 30 ms)
  const MOUNTS_PER_FRAME = 2;
  // Thumbnails are rendered at the scale that covers LIVE_IN on this screen without upscaling
  // (0.8 on a 2x display): 0.4, 0.6, 0.8 or 1, see THUMB_SCALES in canvas.py
  const THUMB_PX = Math.min(1, Math.max(0.4, Math.ceil(LIVE_IN * (window.devicePixelRatio || 1) * 5 - 0.01) / 5));
  let seenTick = 0;
  const BAR_TEXT_ZOOM = 0.3;   // below this zoom the 11 px bar text is under 3.3 px: hidden (#canvas.far)
  let far = false;
  const THUMBS = !STATIC;
  const VIRTUAL = !OVERVIEW;
  let SW = stage.clientWidth, SH = stage.clientHeight;
  window.addEventListener('resize', () => { SW = stage.clientWidth; SH = stage.clientHeight; visDirty = true; schedule(); });

  function thumbUrl(file, v) {
    return BASE + '/thumbs/' + encodeURIComponent(file.replace(/\.html$/, '')) + '.png?v=' + v + '&s=' + THUMB_PX;
  }

  // ── Frame scheduler: input handlers only update state; DOM writes happen once per frame ──
  let frameReq = 0, xformDirty = false, visDirty = false, moving = false, settleTimer = 0;
  // idle: the view has rested. Live boards mount only then (130 ms after the last input at a live
  // zoom), and thumbnails are requested and swapped in only then (300 ms when zoomed out): a new
  // image painted mid-gesture re-rasters the canvas layer, and every request keeps the server's
  // background Chrome busy while the user pans or zooms. idleSeq counts the rests.
  let idle = false, idleTimer = 0, idleSeq = 0;
  const SETTLE_MS = 130, THUMB_IDLE_MS = 170;
  function schedule() { if (!frameReq) frameReq = requestAnimationFrame(frame); }
  function frame() {
    frameReq = 0;
    if (xformDirty) {
      xformDirty = false;
      // A jump far out (the F key): the layer was painted at the old zoom, and the whole canvas
      // coming into view would be painted into it at that zoom. Without the layer the browser
      // paints at the new zoom; the layer comes back once the view rests.
      const jump = layerScale && sc < layerScale * 0.5;
      if (jump) { cvs.classList.remove('layer'); layerScale = 0; if (THUMBS && sc < LIVE_OUT) coverLive(); }
      cvs.style.transform = `translate(${vx}px,${vy}px) scale(${sc})`;
      if ((VIRTUAL && sc < BAR_TEXT_ZOOM) !== far) { far = !far; cvs.classList.toggle('far', far); }   // the overview PNG keeps its titles
      if (moving && !layerScale && !jump) promote();
      zoomLbl.textContent = Math.round(sc * 100) + '%';
    }
    if (dragging && dragging.dirty) {
      dragging.dirty = false;
      dragging.el.style.transform = `translate(${dragging.x - dragging.ox}px,${dragging.y - dragging.oy}px)`;
      updateArrowsFor(dragging.file);
    }
    if (visDirty) { visDirty = false; updateVisibility(); }
  }

  // ── Transform ────────────────────────────────────────────────────────────
  // Input handlers only set the new view; loads are cancelled (or kept) in the next frame
  function applyXform() {
    xformDirty = true; visDirty = true; moving = true; idle = false;
    clearTimeout(settleTimer);
    clearTimeout(idleTimer);
    settleTimer = setTimeout(settle, SETTLE_MS);
    schedule();
  }
  // The canvas keeps its own GPU layer (will-change) between gestures: promoting it when a gesture
  // starts repaints every live board, which cost WebKit a 100 to 150 ms first frame. The layer keeps
  // the bitmap painted at the zoom it was promoted at, so after a zoom the layer is dropped (the
  // browser repaints sharply at the new zoom) and promoted again once the view is idle.
  // WebKit paints a new layer on its first transform change, so a promotion made at rest is followed
  // by a 0.01 px nudge: that paint (about 100 ms with live boards) happens now, not on the first
  // frame of the next gesture.
  let layerScale = 0;   // zoom of the current layer bitmap; 0 = no layer
  function promote() { cvs.classList.add('layer'); layerScale = sc; }
  function warmLayer() {
    requestAnimationFrame(() => {
      if (moving) return;
      cvs.style.transform = `translate(${vx + 0.01}px,${vy}px) scale(${sc})`;
      requestAnimationFrame(() => { xformDirty = true; schedule(); });
    });
  }
  function settle() {
    moving = false;
    if (layerScale && layerScale !== sc) { cvs.classList.remove('layer'); layerScale = 0; }
    visDirty = true;
    schedule();
    if (THUMBS && sc < LIVE_OUT) idleTimer = setTimeout(goIdle, THUMB_IDLE_MS);
    else goIdle();
  }
  function goIdle() {
    idle = true; idleSeq++; visDirty = true;
    if (!layerScale && VIRTUAL) { promote(); warmLayer(); }
    schedule();
  }

  // ── Virtualization ───────────────────────────────────────────────────────
  let lastVisSc = 0;
  function updateVisibility() {
    if (!canvasData) return;
    const zoomed = sc !== lastVisSc;
    lastVisSc = sc;
    const vx0 = -vx / sc, vy0 = -vy / sc, vx1 = (SW - vx) / sc, vy1 = (SH - vy) / sc;
    const mx = SW * MARGIN / sc, my = SH * MARGIN / sc;
    const x0 = vx0 - mx, y0 = vy0 - my, x1 = vx1 + mx, y1 = vy1 + my;
    seenTick++;
    const mountVis = [], mountNear = [], thumbs = [];
    let visLoading = false;
    for (const file in recs) {
      const r = recs[file], b = canvasData.boards[file];
      if (!b) continue;
      // The overview render (not virtual) needs every iframe before its load event
      if (!VIRTUAL) { if (r.kind !== 'live') mountLive(r); continue; }
      const near = !r.hidden && b.x < x1 && b.x + b.w > x0 && b.y < y1 && b.y + b.h > y0;
      // A load still running is stopped when the zoom changes (the board repaints at every step)
      // or the board leaves the view and its margin; a pan that keeps it near lets it finish
      if (r.kind === 'live' && r.iframe && r.iframe.__loading && (zoomed || !near)) cancelLoad(r);
      if (!near) {
        // Off screen: keeps what it shows (evictLive unloads old iframes), except that the new
        // thumbnail of an edited board is swapped in right away. A collapsed board unloads.
        if (r.hidden && r.kind === 'live') standIn(r);
        else if (idle && r.fresh && r.kind === 'thumb') showThumb(r);
        continue;
      }
      r.seen = seenTick;
      const area = Math.max(0, Math.min(b.x + b.w, vx1) - Math.max(b.x, vx0)) *
                   Math.max(0, Math.min(b.y + b.h, vy1) - Math.max(b.y, vy0));
      const live = !THUMBS || sc >= LIVE_IN || (sc >= LIVE_OUT && r.kind === 'live');
      if (live) {
        if (r.kind === 'live') {
          if (r.covered) uncover(r);
          if (r.iframe.__loading) {
            if (area > 0) visLoading = true;
            if (!moving && r.iframe.__ready) reveal(r, r.iframe);   // loaded during a pan
          }
        } else if (r.stale && !zoomed) mountLive(r);   // shows an old version: no idle gate
        // New iframes are created only once the view rests (loading a board mid-gesture drops frames)
        else if (idle) (area > 0 ? mountVis : mountNear).push([r, area]);
        else standIn(r);
      } else if (r.kind === 'live') {
        // Zoomed out: swap to the thumbnail once one is decoded, never to a blank card
        if (idle) { if (r.img || r.fresh) showThumb(r); else requestThumb(r); }
      } else if (idle) thumbs.push([r, area]);
      else if (r.stale && r.fresh) showThumb(r);
      else if (r.kind !== 'thumb') standIn(r);
    }
    if (idle) {
      // The server renders the most recent request first: the largest on screen are asked last
      thumbs.sort((a, b) => a[1] - b[1]);
      for (const [r] of thumbs) showThumb(r);
      // Visible boards first, largest first, a few per frame; the margin once they have loaded
      const queue = mountVis.length ? mountVis.sort((a, b) => b[1] - a[1]) : visLoading ? [] : mountNear;
      for (let i = 0; i < queue.length && i < MOUNTS_PER_FRAME; i++) mountLive(queue[i][0]);
      if (queue.length > MOUNTS_PER_FRAME) { visDirty = true; schedule(); }
    }
    if (VIRTUAL && !moving) evictLive();
  }

  // A jump to a thumbnail zoom (the F key): live boards that have a thumbnail show it at once and
  // their iframes stop painting (WebKit and Firefox took 150 to 300 ms to paint 16 live boards
  // at the new zoom). The iframes are removed once the view rests, or shown again if the zoom
  // comes back up first.
  function coverLive() {
    for (const file in recs) {
      const r = recs[file];
      if (r.kind !== 'live' || r.iframe.__loading || !r.img) continue;
      r.iframe.classList.add('pending');
      if (!r.img.isConnected) r.div.appendChild(r.img);
      r.covered = true;
    }
  }
  function uncover(r) {
    r.covered = false;
    if (r.kind !== 'live' || r.iframe.__loading) return;
    r.iframe.classList.remove('pending');
    if (r.img) r.img.remove();
  }

  function liveArea(r) { const b = canvasData.boards[r.file]; return b ? b.w * b.h : 0; }

  // Over the budget: the least recently seen off-screen iframes go back to their thumbnails
  function evictLive() {
    const live = Object.values(recs).filter((r) => r.kind === 'live');
    let n = live.length, area = live.reduce((a, r) => a + liveArea(r), 0);
    if (n <= LIVE_MAX && area <= LIVE_AREA) return;
    live.sort((a, b) => (a.seen || 0) - (b.seen || 0));
    for (const r of live) {
      if (n <= LIVE_MAX && area <= LIVE_AREA) break;
      if (r.seen === seenTick) break;   // on screen now: never unloaded
      n--; area -= liveArea(r);
      standIn(r);
      requestThumb(r);   // none yet: ask now, so the board is not blank when it comes back
    }
  }

  function requestThumb(r) {
    if (THUMBS && !r.loader && !r.fresh && (!r.img || r.thumbState === 'stale') &&
        (!r.thumbState || r.thumbState === 'stale' || r.thumbState === 'pending')) loadThumb(r);
  }

  // A board still loading goes back to its stand-in and loads again once the view rests. A board
  // reloading after an edit keeps showing its previous iframe instead.
  function cancelLoad(r) {
    if (r.prev) { r.iframe.remove(); r.iframe = r.prev; r.prev = null; }
    else standIn(r);
  }

  function dropIframe(r) {
    r.covered = false;
    if (r.iframe) { r.iframe.remove(); r.iframe = null; }
    if (r.prev) { r.prev.remove(); r.prev = null; }
  }

  // The new iframe loads hidden over what the board shows now (its thumbnail, the title card, or
  // the previous iframe of an edited board), is revealed one frame after its load event, and then
  // the thumbnail is detached (kept for the next stand-in) and a previous iframe removed.
  function mountLive(r) {
    const b = canvasData.boards[r.file];
    if (r.fresh) { if (r.img) r.img.replaceWith(r.fresh); else r.div.appendChild(r.fresh); r.img = r.fresh; r.fresh = null; }
    if (r.iframe && !r.iframe.__loading) { if (r.prev) r.prev.remove(); r.prev = r.iframe; }
    else if (r.iframe) r.iframe.remove();
    const iframe = document.createElement('iframe');
    iframe.className = 'pending';
    iframe.src = boardUrl(r.file) + (r.ver ? '?_=' + r.ver : '');
    iframe.width = b.w;
    iframe.height = b.h;
    // Boards run in an opaque origin: their scripts cannot call this server's APIs.
    // A file:// page (overview, an export opened from disk) has no server to protect, and an
    // opaque origin there could not load ../shared/*.css, so it keeps the file origin.
    iframe.setAttribute('sandbox', 'allow-scripts allow-forms allow-popups' +
                        (location.protocol === 'file:' ? ' allow-same-origin' : ''));
    iframe.setAttribute('loading', 'lazy');
    iframe.setAttribute('scrolling', 'no');
    iframe.tabIndex = -1;
    iframe.__loading = true;
    iframe.__ready = false;
    iframe.addEventListener('load', () => {
      if (r.iframe !== iframe) return;
      reveal(r, iframe);
      requestThumb(r);   // so this board has a thumbnail to show once its iframe is unloaded
    });
    r.div.appendChild(iframe);
    r.iframe = iframe;
    r.kind = 'live';
  }

  // Shows a loaded iframe after a painted frame (the load event can come before the first paint).
  // While the view moves it waits (__ready) and updateVisibility reveals it once the view rests:
  // the first paint of a board would land on a gesture frame.
  function reveal(r, iframe) {
    iframe.__ready = true;
    if (moving && VIRTUAL) return;
    iframe.__ready = false;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      if (r.iframe !== iframe || !iframe.__loading) return;
      if (moving && VIRTUAL) { iframe.__ready = true; return; }
      iframe.__loading = false;
      iframe.classList.remove('pending');
      r.stale = false;
      visDirty = true; schedule();   // boards in the margin wait for the visible ones
      requestAnimationFrame(() => {
        if (r.iframe !== iframe) return;
        if (r.prev) { r.prev.remove(); r.prev = null; }
        if (r.img) r.img.remove();
      });
    }));
  }

  // Cheap content while a board is off screen or the view is moving: the thumbnail it already
  // shows (r.img is always a decoded image), otherwise the white card with the title.
  // No new request and no swap here.
  function standIn(r) {
    dropIframe(r);
    if (!r.img && r.fresh) { r.img = r.fresh; r.fresh = null; }   // a blank card is worse than a swap
    if (r.img) { if (!r.img.isConnected) r.div.appendChild(r.img); r.kind = 'thumb'; }
    else r.kind = 'none';
  }

  // Called only while idle: swaps in a decoded thumbnail and requests a missing or stale one
  // A thumbnail still being rendered is asked for again once per rest: the server renders the most
  // recent request first, so the boards in view move to the front of its queue.
  function showThumb(r) {
    dropIframe(r);
    if (r.fresh) {
      if (r.img) r.img.replaceWith(r.fresh); else r.div.appendChild(r.fresh);
      r.img = r.fresh; r.fresh = null;
      if (r.img.__ver === r.ver) r.stale = false;
    }
    if (!r.thumbState || r.thumbState === 'stale' || (r.thumbState === 'pending' && r.askedAt !== idleSeq)) loadThumb(r);
    if (r.img && !r.img.isConnected) r.div.appendChild(r.img);
    r.kind = 'thumb';
  }

  // Load and decode off the DOM, then let the next idle frame swap it in: decoding never lands
  // on a frame of a gesture. A 202 (still rendering) fails to decode; a 'thumb' event follows.
  function loadThumb(r) {
    r.thumbState = 'loading';
    r.askedAt = idleSeq;
    const img = new Image();
    img.__ver = r.ver;
    img.className = 'thumb ok';
    img.alt = '';
    img.decoding = 'async';
    img.draggable = false;
    img.src = thumbUrl(r.file, r.ver + '.' + (++r.tv));
    r.loader = img;
    img.decode().then(() => {
      if (r.loader !== img) return;
      r.loader = null; r.fresh = img; r.thumbState = 'ok';
      if (idle) { visDirty = true; schedule(); }
    }, () => {
      if (r.loader !== img) return;
      r.loader = null;
      if (r.thumbState === 'loading') r.thumbState = 'pending';
      else if (r.thumbState === 'stale' && r.stale) loadThumb(r);   // rendered while this request was out
    });
  }

  // ── Toast ────────────────────────────────────────────────────────────────
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('on'), 1800);
  }

  // ── Load canvas ──────────────────────────────────────────────────────────
  async function loadCanvas(redraw) {
    if (STATIC) {
      canvasData = normalize(STATIC_CANVAS);
    } else {
      const r = await fetch(BASE + '/canvas.json?_=' + Date.now());
      canvasData = normalize(await r.json());
    }
    if (redraw !== false) renderAll();
  }

  // ── Render ───────────────────────────────────────────────────────────────
  // Updates boards in place: an iframe that is moved or recreated reloads its board, so a
  // canvas.json change (for example a saved drag) must not rebuild them.
  function renderAll() {
    const { boards = {}, groups = [] } = canvasData;

    // Compute group background boxes
    const gBounds = {};
    for (const [, b] of Object.entries(boards)) {
      const g = b.group;
      if (!g) continue;
      if (!gBounds[g]) gBounds[g] = { x1: Infinity, y1: Infinity, x2: -Infinity, y2: -Infinity };
      const gb = gBounds[g];
      gb.x1 = Math.min(gb.x1, b.x - 28);
      gb.y1 = Math.min(gb.y1, b.y - 58);
      gb.x2 = Math.max(gb.x2, b.x + b.w + 28);
      gb.y2 = Math.max(gb.y2, b.y + b.h + 28);
    }

    // Render groups (bottom layer)
    grpLayer.textContent = '';
    for (const grp of groups) {
      const gb = gBounds[grp.id];
      if (!gb) continue;
      const gw = gb.x2 - gb.x1, gh = gb.y2 - gb.y1;

      const bg = document.createElement('div');
      bg.className = 'grp-bg';
      bg.style.cssText =
        `left:${gb.x1}px;top:${gb.y1}px;width:${gw}px;height:${gh}px;` +
        `background:${safeColor(grp.color, 'rgba(255,255,255,0.04)')};`;
      grpLayer.appendChild(bg);

      const hdr = document.createElement('div');
      hdr.className = 'grp-hdr';
      hdr.style.cssText = `left:${gb.x1 + 10}px;top:${gb.y1 + 10}px;color:${safeColor(grp.textColor, '#999')};`;
      const isCol = collapsed.has(grp.id);
      hdr.innerHTML = `<span class="grp-arrow">${isCol ? '▶' : '▼'}</span><span>${escHtml(grp.label || grp.id)}</span>`;
      hdr.addEventListener('click', () => toggleGroup(grp.id));
      grpLayer.appendChild(hdr);
    }

    // Render artboards
    for (const file of Object.keys(recs)) {
      if (!boards[file]) { recs[file].div.remove(); delete recs[file]; }
    }
    for (const [file, b] of Object.entries(boards)) {
      const r = recs[file] || createBoard(file);
      const isHidden = !!(b.group && collapsed.has(b.group));
      r.hidden = isHidden;
      r.div.className = 'board' + (isHidden ? ' collapsed' : '');
      if (!dragging || dragging.file !== file) {
        r.div.style.cssText = `left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px;`;
      }
      if (r.iframe && (+r.iframe.width !== b.w || +r.iframe.height !== b.h)) {
        r.iframe.width = b.w; r.iframe.height = b.h;
      }
      if (r.sizeKey !== b.w + 'x' + b.h) {   // a resized board needs a new thumbnail
        if (r.sizeKey && r.thumbState) r.thumbState = 'stale';
        r.sizeKey = b.w + 'x' + b.h;
      }
      fillBar(r, b);
    }
    renderArrows();
    // The overview screenshot waits for the page load event, so its iframes must exist before it
    if (!VIRTUAL) updateVisibility();
    else { visDirty = true; schedule(); }
  }

  function createBoard(file) {
    const div = document.createElement('div');
    div.dataset.file = file;
    const ph = document.createElement('div');
    ph.className = 'ph';
    ph.textContent = file.replace('.html', '');
    const bar = document.createElement('div');
    bar.className = 'board-bar';
    div.appendChild(ph);
    div.appendChild(bar);
    const r = { file, div, bar, iframe: null, img: null, fresh: null, loader: null, kind: 'none', ver: 0, tv: 0,
                thumbState: '', hidden: false };

    // Click: copy the file ID
    bar.addEventListener('click', (e) => {
      if (dragging) return;
      const id = file.replace('.html', '');
      if (navigator.clipboard) {
        navigator.clipboard.writeText(id)
          .then(() => showToast('Copied: ' + id))
          .catch(() => showToast(id));
      } else {
        showToast(id);
      }
      e.stopPropagation();
    });

    // Double click: open in a new tab
    bar.addEventListener('dblclick', (e) => {
      e.stopPropagation();
      window.open(boardUrl(file), '_blank', 'noopener');
    });

    // Drag by the title bar (unless read-only)
    if (!READ_ONLY) {
      bar.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        const b = canvasData.boards[file];
        if (!b) return;
        e.stopPropagation();
        dragging = { file, el: div, sx: e.clientX, sy: e.clientY, ox: b.x, oy: b.y, x: b.x, y: b.y, dirty: false };
        e.preventDefault();
      });
    }

    boardLayer.appendChild(div);
    recs[file] = r;
    return r;
  }

  function fillBar(r, b) {
    const bar = r.bar, file = r.file;
    const badgeHtml = b.status === 'approved'
      ? '<span class="status-badge approved"></span>'
      : b.status === 'rejected'
        ? '<span class="status-badge rejected"></span>'
        : '';
    const titleClass = b.status === 'rejected' ? ' rejected' : '';
    bar.innerHTML =
      `<span class="board-id">${escHtml(file.replace('.html', ''))}</span>` +
      badgeHtml +
      `<span class="board-title-text${titleClass}">${escHtml(b.title || '')}</span>`;
    if (b.note) bar.title = b.note; else bar.removeAttribute('title');
    if (b.impl) {
      const built = document.createElement('span');
      built.className = 'built-badge';
      built.textContent = 'built';
      built.title = 'Route: ' + String(b.impl.route == null ? '' : b.impl.route);
      bar.appendChild(built);
    }
    if (b.comments.length) {
      const cb = document.createElement('button');
      cb.type = 'button';
      cb.className = 'cmt-badge';
      cb.title = b.comments.length + ' comment(s)';
      cb.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2h12a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H6l-3 3v-3H2a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"/></svg>';
      cb.appendChild(document.createTextNode(String(b.comments.length)));
      cb.addEventListener('mousedown', (e) => e.stopPropagation());
      cb.addEventListener('dblclick', (e) => e.stopPropagation());
      cb.addEventListener('click', (e) => { e.stopPropagation(); openComments(file, cb); });
      bar.appendChild(cb);
    }
  }

  // ── Render arrows ────────────────────────────────────────────────────────
  function arrowGeometry(lnk, boards, all) {
    const fb = boards[lnk.from], tb = boards[lnk.to];
    let sx, sy, tx, ty, cx1, cy1, cx2, cy2;
    if (tb.x >= fb.x + fb.w) {
      // Forward: right edge -> left edge
      sx = fb.x + fb.w; sy = fb.y + fb.h / 2;
      tx = tb.x;        ty = tb.y + tb.h / 2;
      const off = Math.max(24, Math.abs(tx - sx) * 0.4);
      cx1 = sx + off; cy1 = sy; cx2 = tx - off; cy2 = ty;
    } else if (tb.y >= fb.y + fb.h || tb.y + tb.h <= fb.y) {
      // Vertical: bottom edge -> top edge (or top -> bottom when the target is above)
      const down = tb.y >= fb.y + fb.h;
      sx = fb.x + fb.w / 2; sy = down ? fb.y + fb.h : fb.y;
      tx = tb.x + tb.w / 2; ty = down ? tb.y : tb.y + tb.h;
      const off = Math.max(24, Math.abs(ty - sy) * 0.4) * (down ? 1 : -1);
      cx1 = sx; cy1 = sy + off; cx2 = tx; cy2 = ty - off;
    } else {
      // Backward on the same row: leave the bottom edge, pass below every board in between, enter the bottom edge
      sx = fb.x + fb.w / 2; sy = fb.y + fb.h;
      tx = tb.x + tb.w / 2; ty = tb.y + tb.h;
      const left = Math.min(fb.x, tb.x), right = Math.max(fb.x + fb.w, tb.x + tb.w);
      let low = Math.max(sy, ty);
      for (const b of all) {
        if (b.x < right && b.x + b.w > left) low = Math.max(low, b.y + b.h);
      }
      low += 60;
      // A cubic with both control points at y=c bottoms out at 0.25*start + 0.75*c
      const c = (low - 0.25 * Math.max(sy, ty)) / 0.75;
      cx1 = sx; cy1 = c; cx2 = tx; cy2 = c;
    }
    return { d: `M${sx},${sy} C${cx1},${cy1} ${cx2},${cy2} ${tx},${ty}`,
             // cubic bezier midpoint at t=0.5
             mx: 0.125*sx + 0.375*cx1 + 0.375*cx2 + 0.125*tx,
             my: 0.125*sy + 0.375*cy1 + 0.375*cy2 + 0.125*ty };
  }

  function renderArrows() {
    while (arrowSvg.lastChild) arrowSvg.removeChild(arrowSvg.lastChild);
    arrowEls = [];
    arrowSvg.classList.toggle('hidden', !showArrows);
    if (!showArrows || !canvasData) return;
    const { boards = {}, links = [] } = canvasData;
    if (!links.length) return;

    const NS = 'http://www.w3.org/2000/svg';
    // Chrome skips zero-sized SVGs, so size it to cover every artboard
    const all = Object.values(boards);
    const x1 = Math.min(...all.map(b => b.x)) - 400, y1 = Math.min(...all.map(b => b.y)) - 400;
    const x2 = Math.max(...all.map(b => b.x + b.w)) + 400, y2 = Math.max(...all.map(b => b.y + b.h)) + 400;
    arrowSvg.style.left = x1 + 'px'; arrowSvg.style.top = y1 + 'px';
    arrowSvg.style.width = (x2 - x1) + 'px'; arrowSvg.style.height = (y2 - y1) + 'px';
    arrowSvg.setAttribute('viewBox', `${x1} ${y1} ${x2 - x1} ${y2 - y1}`);
    const defs = document.createElementNS(NS, 'defs');
    defs.innerHTML =
      '<marker id="ah" markerWidth="8" markerHeight="6" refX="7" refY="3" ' +
      'orient="auto" markerUnits="strokeWidth">' +
      '<path d="M0,0 L0,6 L8,3 z" fill="#ffb547"/></marker>';
    arrowSvg.appendChild(defs);

    for (const lnk of links) {
      if (!boards[lnk.from] || !boards[lnk.to]) continue;
      const g = arrowGeometry(lnk, boards, all);
      const path = document.createElementNS(NS, 'path');
      path.setAttribute('d', g.d);
      path.setAttribute('stroke', '#ffb547');
      path.setAttribute('stroke-width', '3');
      path.setAttribute('fill', 'none');
      path.setAttribute('marker-end', 'url(#ah)');
      arrowSvg.appendChild(path);

      let txt = null;
      if (lnk.label) {
        txt = document.createElementNS(NS, 'text');
        txt.setAttribute('x', g.mx);
        txt.setAttribute('y', g.my - 6);
        txt.setAttribute('fill', '#ffb547');
        txt.setAttribute('font-size', '14');
        txt.setAttribute('font-weight', '700');
        txt.setAttribute('stroke', '#1e1e1e');
        txt.setAttribute('stroke-width', '4');
        txt.setAttribute('paint-order', 'stroke');
        txt.setAttribute('font-family', '-apple-system, sans-serif');
        txt.setAttribute('text-anchor', 'middle');
        txt.textContent = lnk.label;
        arrowSvg.appendChild(txt);
      }
      arrowEls.push({ lnk, path, text: txt });
    }
  }

  // While dragging, only the arrows that touch the dragged board move
  function updateArrowsFor(file) {
    if (!showArrows || !arrowEls.length) return;
    const boards = canvasData.boards, all = Object.values(boards);
    for (const a of arrowEls) {
      if (a.lnk.from !== file && a.lnk.to !== file) continue;
      const g = arrowGeometry(a.lnk, boards, all);
      a.path.setAttribute('d', g.d);
      if (a.text) { a.text.setAttribute('x', g.mx); a.text.setAttribute('y', g.my - 6); }
    }
  }

  // ── Comment panel ────────────────────────────────────────────────────────
  const cmtPanel = document.getElementById('cmt-panel');
  function closeComments() { cmtPanel.hidden = true; cmtPanel.textContent = ''; }
  function openComments(file, anchor) {
    const b = canvasData && canvasData.boards[file];
    if (!b) return;
    cmtPanel.textContent = '';
    const head = document.createElement('div');
    head.className = 'cmt-head';
    const ttl = document.createElement('span');
    ttl.textContent = file.replace('.html', '') + ' comments';
    const close = document.createElement('button');
    close.type = 'button';
    close.className = 'cmt-close';
    close.textContent = '\u00d7';
    close.setAttribute('aria-label', 'Close');
    close.addEventListener('click', closeComments);
    head.appendChild(ttl); head.appendChild(close);
    cmtPanel.appendChild(head);
    for (const c of b.comments) {
      const item = document.createElement('div');
      item.className = 'cmt-item';
      const meta = document.createElement('div');
      meta.className = 'cmt-meta';
      meta.textContent = [c.by, c.created].filter(v => v != null && v !== '').map(String).join(', ');
      const text = document.createElement('div');
      text.className = 'cmt-text';
      text.textContent = String(c.text == null ? '' : c.text);
      item.appendChild(meta); item.appendChild(text);
      cmtPanel.appendChild(item);
    }
    cmtPanel.hidden = false;
    const r = anchor.getBoundingClientRect();
    const pw = cmtPanel.offsetWidth, ph = cmtPanel.offsetHeight;
    cmtPanel.style.left = Math.max(12, Math.min(window.innerWidth - pw - 12, r.right - pw)) + 'px';
    cmtPanel.style.top = Math.max(12, Math.min(window.innerHeight - ph - 12, r.bottom + 6)) + 'px';
  }
  cmtPanel.addEventListener('mousedown', (e) => e.stopPropagation());
  cmtPanel.addEventListener('wheel', (e) => e.stopPropagation(), { passive: true });
  window.addEventListener('mousedown', () => { if (!cmtPanel.hidden) closeComments(); });

  function toggleGroup(gid) {
    if (collapsed.has(gid)) collapsed.delete(gid);
    else collapsed.add(gid);
    renderAll();
  }

  // ── Fit to view ──────────────────────────────────────────────────────────
  function fitToView() {
    if (!canvasData) return;
    // #<board id> (from the dashboard's board tiles) fits that one board
    let focus = null;
    try { focus = decodeURIComponent(location.hash.slice(1)); } catch (_) {}
    const one = focus && (canvasData.boards[focus] || canvasData.boards[focus + '.html']);
    const bds = one ? [one] : Object.values(canvasData.boards || {});
    if (!bds.length) return;
    const minX = Math.min(...bds.map(b => b.x));
    const minY = Math.min(...bds.map(b => b.y));
    const maxX = Math.max(...bds.map(b => b.x + b.w));
    const maxY = Math.max(...bds.map(b => b.y + b.h));
    const cw = maxX - minX + 96, ch = maxY - minY + 120;
    const sw = SW, sh = SH;
    const ns = Math.min(sw / cw, sh / ch, OVERVIEW ? Infinity : 1);
    sc = Math.max(0.05, ns);
    vx = (sw - cw * sc) / 2 - minX * sc + 48 * sc;
    vy = (sh - ch * sc) / 2 - minY * sc + 60 * sc;
    applyXform();
  }

  // ── Mouse events ─────────────────────────────────────────────────────────
  stage.addEventListener('mousedown', (e) => {
    if (e.target === stage || e.target === cvs ||
        e.target.closest?.('.grp-bg') || e.target.closest?.('.grp-hdr')) {
      if (e.button !== 0) return;
      panning = true;
      panRef = { x: e.clientX - vx, y: e.clientY - vy };
      stage.style.cursor = 'grabbing';
      e.preventDefault();
    }
  });

  window.addEventListener('mousemove', (e) => {
    if (panning) {
      vx = e.clientX - panRef.x;
      vy = e.clientY - panRef.y;
      applyXform();
    } else if (dragging) {
      const nx = dragging.ox + (e.clientX - dragging.sx) / sc;
      const ny = dragging.oy + (e.clientY - dragging.sy) / sc;
      dragging.x = nx; dragging.y = ny; dragging.dirty = true;
      const b = canvasData.boards[dragging.file];
      if (b) { b.x = nx; b.y = ny; }
      schedule();
    }
  });

  window.addEventListener('mouseup', async (e) => {
    panning = false;
    stage.style.cursor = '';
    if (!dragging) return;
    const { file, el, sx, sy, ox, oy } = dragging;
    dragging = null;
    el.style.transform = '';
    const dx = (e.clientX - sx) / sc;
    const dy = (e.clientY - sy) / sc;
    const nx = Math.round(ox + dx);
    const ny = Math.round(oy + dy);
    if (Math.abs(dx) < 2 && Math.abs(dy) < 2) {
      const b = canvasData.boards[file];
      if (b) { b.x = ox; b.y = oy; }
      el.style.left = ox + 'px'; el.style.top = oy + 'px';
      return;
    }
    undoStack.push({ file, ox, oy, nx, ny });
    if (undoStack.length > 100) undoStack.shift();
    redoStack.length = 0;
    await moveBoard(file, nx, ny);
  });

  // ── Undo (artboard moves) ────────────────────────────────────────────────
  const undoStack = [], redoStack = [];

  async function moveBoard(file, x, y) {
    const b = canvasData.boards[file];
    if (!b) return;
    b.x = x; b.y = y;
    const r = recs[file];
    if (r) { r.div.style.left = x + 'px'; r.div.style.top = y + 'px'; }
    renderArrows();
    visDirty = true; schedule();
    try {
      const resp = await fetch(BASE + '/api/layout', {
        method: 'POST',
        // The server checks this exact Content-Type and the browser-sent Origin
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ board: file, x, y })
      });
      if (!resp.ok) showToast('Could not save position (' + resp.status + ')');
    } catch (_) {
      showToast('Could not save position: server disconnected');
    }
  }

  async function undoMove(redo) {
    const from = redo ? redoStack : undoStack, to = redo ? undoStack : redoStack;
    const m = from.pop();
    if (!m) { showToast(redo ? 'Nothing to redo' : 'Nothing to undo'); return; }
    to.push(m);
    const id = m.file.replace('.html', '');
    if (redo) { await moveBoard(m.file, m.nx, m.ny); showToast('Redo: ' + id); }
    else      { await moveBoard(m.file, m.ox, m.oy); showToast('Undo: ' + id); }
  }

  // Wheel zoom
  stage.addEventListener('wheel', (e) => {
    e.preventDefault();
    // Scale by delta so a mouse wheel (large deltas) and a trackpad (many small deltas) zoom at the same speed
    const dy = e.deltaMode === 1 ? e.deltaY * 33 : e.deltaY;
    const factor = Math.exp(-dy * (e.ctrlKey ? 0.01 : 0.002));
    const ns = Math.max(0.04, Math.min(5, sc * factor));
    vx = e.clientX - (e.clientX - vx) * ns / sc;
    vy = e.clientY - (e.clientY - vy) * ns / sc;
    sc = ns;
    applyXform();
  }, { passive: false });

  // ── Touch (mobile) ───────────────────────────────────────────────────────
  let touchPan = null, pinchDist = null, pinchMid = null;

  stage.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      touchPan = { x: e.touches[0].clientX - vx, y: e.touches[0].clientY - vy };
      pinchDist = null;
    } else if (e.touches.length === 2) {
      touchPan = null;
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      pinchDist = Math.hypot(dx, dy);
      pinchMid = {
        x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
        y: (e.touches[0].clientY + e.touches[1].clientY) / 2
      };
    }
  }, { passive: true });

  stage.addEventListener('touchmove', (e) => {
    if (e.touches.length === 1 && touchPan) {
      e.preventDefault();
      vx = e.touches[0].clientX - touchPan.x;
      vy = e.touches[0].clientY - touchPan.y;
      applyXform();
    } else if (e.touches.length === 2 && pinchDist !== null) {
      e.preventDefault();
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.hypot(dx, dy);
      const factor = dist / pinchDist;
      const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      const my = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      const ns = Math.max(0.04, Math.min(5, sc * factor));
      vx = mx - (mx - vx) * ns / sc;
      vy = my - (my - vy) * ns / sc;
      sc = ns;
      pinchDist = dist;
      pinchMid = { x: mx, y: my };
      applyXform();
    }
  }, { passive: false });

  stage.addEventListener('touchend', () => {
    touchPan = null; pinchDist = null;
  }, { passive: true });

  // ── Keyboard ─────────────────────────────────────────────────────────────
  window.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && (e.key === 'z' || e.key === 'Z')) {
      e.preventDefault();
      if (!READ_ONLY) undoMove(e.shiftKey);
      return;
    }
    if ((e.metaKey || e.ctrlKey) && (e.key === 'y' || e.key === 'Y')) {
      e.preventDefault();
      if (!READ_ONLY) undoMove(true);
      return;
    }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'Escape') closeComments();
    if (e.key === 'f' || e.key === 'F') fitToView();
    if (e.key === 'l' || e.key === 'L') {
      showArrows = !showArrows;
      renderArrows();
      showToast(showArrows ? 'Arrows shown' : 'Arrows hidden');
    }
  });

  // ── SSE (server mode only) ───────────────────────────────────────────────
  // Changes arrive in bursts (an agent writing many boards, every saved drag), so they are
  // collected for a moment and applied once; only boards that show content reload.
  let changedBoards = new Set(), canvasChanged = false, sseTimer = 0;
  function flushChanges() {
    sseTimer = 0;
    for (const file of changedBoards) {
      const r = recs[file];
      if (!r) continue;
      r.ver++;
      if (r.thumbState) r.thumbState = 'stale';
      if (r.kind === 'live') mountLive(r);   // loads hidden over the old one, then replaces it
      else if (r.kind === 'thumb') {
        // Shows an old version (also off screen): ask for the new thumbnail now, and mount live
        // without the idle wait when it comes into view at a live zoom (r.stale)
        r.stale = true; r.fresh = null; r.loader = null;
        loadThumb(r);
        visDirty = true; schedule();
      }
    }
    changedBoards.clear();
    if (canvasChanged) { canvasChanged = false; loadCanvas(true); }
  }
  function onThumbReady(file) {
    const r = recs[file];
    if (!r || !r.thumbState) return;
    r.thumbState = 'stale';
    // Live now, or showing an old version: decode it in the background (also off screen)
    if (r.kind === 'live' || r.stale) requestThumb(r);
    if (r.kind !== 'live') { visDirty = true; schedule(); }
  }
  let es = null;
  function setupSSE() {
    if (STATIC) return;
    if (new URLSearchParams(window.location.search).get('static') === '1') return;
    if (es) es.close();
    es = new EventSource(BASE + '/api/events');
    es.onmessage = (e) => {
      try {
        const d = JSON.parse(e.data);
        if (d.type === 'board' && d.file) changedBoards.add(d.file);
        else if (d.type === 'canvas') canvasChanged = true;
        else if (d.type === 'thumb' && d.file) { onThumbReady(d.file); return; }
        else return;
        if (!sseTimer) sseTimer = setTimeout(flushChanges, 250);
      } catch (_) {}
    };
    es.onerror = () => { es.close(); setTimeout(setupSSE, 3000); };
  }

  // ── Start ────────────────────────────────────────────────────────────────
  // The dashboard's "N new" badge counts boards edited after the last visit to this idea
  function markVisit() { try { localStorage.setItem('mc:visit:' + BASE.replace(/^\/+/, ''), String(Date.now())); } catch (_) {} }
  if (!STATIC) { markVisit(); window.addEventListener('pagehide', markVisit); }
  applyXform();
  loadCanvas().then(() => {
    fitToView();
    document.getElementById('loading').classList.add('gone');
    setupSSE();
  }).catch((err) => {
    document.getElementById('loading').textContent = 'Failed to load: ' + err.message;
  });

})();
</script>
</body>
</html>
