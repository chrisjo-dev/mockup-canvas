<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup Canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" id="fonts" media="print" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<script>
  // Web fonts do not block the first paint (the stylesheet loads as print, then applies)
  (function () {
    var l = document.getElementById('fonts');
    if (l.sheet) l.media = 'all'; else l.onload = function () { l.media = 'all'; };
  })();
  // Theme before first paint: ?theme= wins, then the saved choice, then dark
  (function () {
    var t = new URLSearchParams(location.search).get('theme');
    try { t = t || localStorage.getItem('mc:theme'); } catch (_) {}
    if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
  })();
</script>
<style>
/* Tokens: design/canvas-dashboard/shared/tokens.css (board names kept as is). Dark is the default. */
:root {
  --bg: #111214; --surface: #18191c; --surface-2: #1f2024; --surface-3: #282a2f; --well: #0b0c0d;
  --line: #2a2c31; --line-strong: #3a3d44; --text: #ececee; --text-2: #a4a7ae; --text-3: #878b93;
  --scrim: rgba(5, 6, 8, 0.66);
  --accent: #6e8bff; --accent-fill: #3358e0; --accent-fill-hover: #2a4cc8; --accent-soft: rgba(110, 139, 255, 0.14);
  --on-accent: #ffffff; --focus: #8aa1ff;
  --st-draft: #8d9199;    --st-draft-soft: rgba(141, 145, 153, 0.16);
  --st-approved: #45c486; --st-approved-soft: rgba(69, 196, 134, 0.15);
  --st-rejected: #f06a72; --st-rejected-soft: rgba(240, 106, 114, 0.15);
  --st-comment: #f2a83b;  --st-comment-soft: rgba(242, 168, 59, 0.15);
  --st-built: #b294ff;    --st-built-soft: rgba(178, 148, 255, 0.16);
  --st-broken: #f06a72;
  --font-sans: 'Instrument Sans', ui-sans-serif, system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', monospace;
  --fs-11: 11px; --lh-11: 16px; --fs-12: 12px; --lh-12: 16px; --fs-13: 13px; --lh-13: 20px;
  --fs-15: 15px; --lh-15: 22px; --fs-18: 18px; --lh-18: 24px; --fs-24: 24px; --lh-24: 30px;
  --fs-32: 32px; --lh-32: 38px;
  --fw-regular: 400; --fw-medium: 500; --fw-semi: 600; --fw-bold: 700;
  --track-tight: -0.02em;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px; --sp-8: 32px;
  --sp-10: 40px; --sp-12: 48px; --sp-16: 64px;
  --r-xs: 4px; --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-pill: 999px;
  --el-1: 0 1px 2px rgba(0, 0, 0, 0.35), 0 4px 12px rgba(0, 0, 0, 0.22);
  --el-2: 0 2px 6px rgba(0, 0, 0, 0.35), 0 18px 48px -8px rgba(0, 0, 0, 0.55);
  --thumb-shadow: 0 1px 1px rgba(0, 0, 0, 0.4), 0 6px 16px -6px rgba(0, 0, 0, 0.6);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-1: 120ms; --dur-2: 200ms; --dur-3: 320ms;
  --topbar-h: 56px; --rail-w: 240px;
  color-scheme: dark;
}
[data-theme="light"] {
  --bg: #f5f5f3; --surface: #ffffff; --surface-2: #f0f0ed; --surface-3: #e6e6e2; --well: #e9e9e5;
  --line: #e2e2de; --line-strong: #cdcdc8; --text: #17181a; --text-2: #4f5257; --text-3: #696c72;
  --scrim: rgba(20, 21, 24, 0.40);
  --accent: #2a52d4; --accent-fill: #2a52d4; --accent-fill-hover: #1e3fa8; --accent-soft: rgba(42, 82, 212, 0.10);
  --focus: #2a52d4;
  --st-draft: #70747c;    --st-draft-soft: rgba(112, 116, 124, 0.12);
  --st-approved: #157a4b; --st-approved-soft: rgba(21, 122, 75, 0.11);
  --st-rejected: #c9343f; --st-rejected-soft: rgba(201, 52, 63, 0.10);
  --st-comment: #a8650a;  --st-comment-soft: rgba(214, 135, 20, 0.13);
  --st-built: #6d48d6;    --st-built-soft: rgba(109, 72, 214, 0.10);
  --st-broken: #c9343f;
  --el-1: 0 1px 2px rgba(20, 20, 30, 0.06), 0 4px 12px rgba(20, 20, 30, 0.06);
  --el-2: 0 2px 6px rgba(20, 20, 30, 0.08), 0 18px 48px -8px rgba(20, 20, 30, 0.22);
  --thumb-shadow: 0 1px 1px rgba(20, 20, 30, 0.08), 0 6px 16px -6px rgba(20, 20, 30, 0.18);
  color-scheme: light;
}
::selection { background: var(--accent-soft); color: var(--text); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* Base */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: var(--fs-13);
  line-height: var(--lh-13); -webkit-font-smoothing: antialiased; overflow: hidden; font-feature-settings: "ss01", "cv11";
}
h1, h2, h3, p { margin: 0; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: inherit; }
input { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.mono { font-family: var(--font-mono); font-size: var(--fs-11); line-height: var(--lh-11); letter-spacing: 0; }
.num { font-variant-numeric: tabular-nums; }
.t2 { color: var(--text-2); } .t3 { color: var(--text-3); }
.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.i.sm { width: 14px; height: 14px; }
.i.lg { width: 20px; height: 20px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Controls */
.kbd {
  font-family: var(--font-mono); font-size: var(--fs-11); line-height: 18px; min-width: 20px; height: 20px; padding: 0 5px;
  display: inline-flex; align-items: center; justify-content: center; border-radius: var(--r-xs);
  background: var(--surface-3); color: var(--text-2); border: 1px solid var(--line-strong); border-bottom-width: 2px;
}
.btn {
  display: inline-flex; align-items: center; gap: var(--sp-2); height: 34px; padding: 0 var(--sp-3);
  border-radius: var(--r-sm); border: 1px solid var(--line-strong); background: var(--surface-2);
  color: var(--text); font-weight: var(--fw-medium); white-space: nowrap;
  transition: background var(--dur-1) var(--ease-out), border-color var(--dur-1) var(--ease-out);
}
.btn:hover { background: var(--surface-3); }
.btn.primary { background: var(--accent-fill); border-color: transparent; color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-fill-hover); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--text); }
.btn.sm { height: 28px; padding: 0 10px; font-size: var(--fs-12); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .45; cursor: default; }
.btn.primary:disabled:hover { background: var(--accent-fill); }
.icon-btn {
  width: 34px; height: 34px; display: inline-grid; place-items: center; border-radius: var(--r-sm); color: var(--text-2);
  border: 1px solid transparent; transition: background var(--dur-1) var(--ease-out);
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn.sm { width: 28px; height: 28px; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: var(--r-pill);
  font-size: var(--fs-12); line-height: 1; font-weight: var(--fw-medium); white-space: nowrap; color: var(--text-2); background: var(--surface-2);
}
.pill .d { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.pill .i { width: 12px; height: 12px; }
.pill.draft    { color: var(--st-draft);    background: var(--st-draft-soft); }
.pill.approved { color: var(--st-approved); background: var(--st-approved-soft); }
.pill.rejected { color: var(--st-rejected); background: var(--st-rejected-soft); }
.pill.comment  { color: var(--st-comment);  background: var(--st-comment-soft); }
.pill.built    { color: var(--st-built);    background: var(--st-built-soft); }
.counts { display: flex; align-items: center; gap: var(--sp-3); font-size: var(--fs-12); color: var(--text-2); font-variant-numeric: tabular-nums; }
.counts span { display: inline-flex; align-items: center; gap: 5px; }
.counts .i { width: 13px; height: 13px; }
.d { display: inline-block; width: 6px; height: 6px; border-radius: 50%; flex: none; }
.d.approved { background: var(--st-approved); } .d.draft { background: var(--st-draft); }
.d.rejected { background: var(--st-rejected); } .d.comment { background: var(--st-comment); }
.d.built { background: var(--st-built); }
.meter { display: flex; height: 6px; border-radius: var(--r-pill); overflow: hidden; gap: 2px; }
.meter > i { display: block; height: 100%; }
.meter .a { background: var(--st-approved); }
.meter .w { background: var(--st-draft); opacity: .55; }
.meter .r { background: var(--st-rejected); opacity: .8; }
.meter .z { background: var(--line); flex: 1; }
.meter.thin { height: 4px; }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface-2); border-radius: var(--r-sm); border: 1px solid var(--line); }
.seg > button {
  height: 26px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; border-radius: var(--r-xs);
  color: var(--text-2); font-size: var(--fs-12); font-weight: var(--fw-medium); white-space: nowrap;
  transition: background var(--dur-2) var(--ease-out), color var(--dur-2) var(--ease-out);
}
.seg > button:hover { color: var(--text); }
.seg > button.on { background: var(--surface-3); color: var(--text); box-shadow: var(--el-1); }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: var(--r-pill);
  border: 1px solid var(--line); color: var(--text-2); font-size: var(--fs-12); font-weight: var(--fw-medium); white-space: nowrap; flex: none;
}
.chip:hover { border-color: var(--line-strong); color: var(--text); }
.chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.chip .n { color: var(--text-3); font-variant-numeric: tabular-nums; }
.chip.on .n { color: var(--bg); opacity: .7; }
.chip .i { width: 12px; height: 12px; }
.chip.bad { color: var(--st-broken); border-color: var(--st-rejected-soft); }
.chip.bad.on { background: var(--st-rejected-soft); border-color: var(--st-broken); }
.code {
  font-family: var(--font-mono); font-size: 12px; line-height: 20px; background: var(--well); color: var(--text);
  border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px var(--sp-3); display: flex; align-items: center; gap: var(--sp-2);
  overflow-wrap: anywhere;
}
.code .p { color: var(--text-3); user-select: none; }
.code .a { color: var(--accent); }
.code .btn { margin-left: auto; }
.section { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -50% 0; } }
.shim { background: linear-gradient(100deg, var(--surface-2) 30%, var(--surface-3) 50%, var(--surface-2) 70%); background-size: 300% 100%; animation: shimmer 1.6s linear infinite; }
@media (prefers-reduced-motion: reduce) { .shim { animation: none; } }

/* Shell */
#app { height: 100%; display: flex; flex-direction: column; }
.topbar {
  height: var(--topbar-h); flex: none; display: flex; align-items: center; gap: var(--sp-4);
  padding: 0 var(--sp-6); border-bottom: 1px solid var(--line); background: var(--bg);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: var(--fw-semi); font-size: var(--fs-15); letter-spacing: var(--track-tight); white-space: nowrap; }
.brand svg { width: 22px; height: 22px; flex: none; }
.brand .host { font-family: var(--font-mono); font-size: var(--fs-11); font-weight: 400; color: var(--text-3); margin-left: 2px; letter-spacing: 0; }
.topbar .spacer { flex: 1; }
.search {
  position: relative; display: flex; align-items: center; height: 34px; width: 420px; flex: none;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); color: var(--text-3);
}
.search.on { border-color: var(--line-strong); }
.search .open { flex: 1; min-width: 0; height: 100%; display: flex; align-items: center; gap: var(--sp-2); padding: 0 6px 0 var(--sp-3); border-radius: var(--r-sm); }
.search .open .ph { flex: 1; color: var(--text-3); text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search .open .val { flex: 1; color: var(--text); text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search .clr { width: 24px; height: 24px; margin-right: 5px; display: grid; place-items: center; border-radius: var(--r-xs); color: var(--text-3); }
.search .clr:hover { background: var(--surface-3); color: var(--text); }
.tb-phone { display: none; }
.tb-narrow { display: none; }
.banner {
  flex: none; display: flex; align-items: center; gap: var(--sp-3); min-height: 40px; padding: 0 var(--sp-6);
  background: var(--accent-soft); color: var(--text); border-bottom: 1px solid var(--line);
}
.banner > .i { color: var(--accent); }
.banner .mono { color: var(--text-2); margin-left: auto; white-space: nowrap; }
.wrap { flex: 1; display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); min-height: 0; }

/* Rail */
.rail { border-right: 1px solid var(--line); padding: var(--sp-5) var(--sp-3) var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-6); overflow-y: auto; min-height: 0; }
.rail h4 { margin: 0 0 var(--sp-1); padding: 0 var(--sp-2); font-size: var(--fs-12); font-weight: var(--fw-semi); color: var(--text-3); }
.rail ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.ri {
  display: flex; align-items: center; gap: var(--sp-2); height: 32px; width: 100%; padding: 0 var(--sp-2); border-radius: var(--r-sm); color: var(--text-2);
  transition: background var(--dur-1) var(--ease-out), color var(--dur-1) var(--ease-out);
}
.ri > .lb { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ri:hover { background: var(--surface-2); color: var(--text); }
.ri .n { margin-left: auto; color: var(--text-3); font-variant-numeric: tabular-nums; font-size: var(--fs-12); flex: none; }
.ri.on { background: var(--surface-3); color: var(--text); }
.ri.on .n { color: var(--text-2); }
.ri .sq { width: 8px; height: 8px; border-radius: 2px; background: var(--line-strong); flex: none; }
.ri .d { width: 8px; height: 8px; }
.ri.bad > .i { color: var(--st-broken); }
.ri > .i.col { color: var(--text-2); }
.ri.bad .n { color: var(--st-broken); }
.ri.off { color: var(--text-3); }
.ri.off .d { background: var(--line-strong); }
.sk { display: inline-block; border-radius: 3px; background: var(--surface-3); }
.ri .n.sk { width: 16px; height: 10px; }
.rail .foot { margin-top: auto; display: flex; flex-direction: column; gap: var(--sp-2); padding: 0 var(--sp-1); }
.rail .foot .btn { justify-content: center; }
.rail .srv { margin-top: var(--sp-2); display: flex; align-items: center; gap: var(--sp-2); color: var(--text-3); padding: 0 var(--sp-1); }
.rail .srv .live { width: 6px; height: 6px; border-radius: 50%; background: var(--st-approved); flex: none; }
.rail .srv .live.idle { background: var(--st-draft); }

/* Main */
main { position: relative; padding: var(--sp-6) var(--sp-8) var(--sp-10); min-width: 0; min-height: 0; overflow-y: auto; outline: none; }
.nb, .nf, .warn-strip { display: none; }
.mh { display: flex; align-items: flex-end; gap: var(--sp-4); margin-bottom: var(--sp-5); }
.mh h1 { font-size: var(--fs-24); line-height: var(--lh-24); font-weight: var(--fw-semi); letter-spacing: var(--track-tight); display: flex; align-items: center; gap: var(--sp-2); min-width: 0; }
.mh h1 .pill { font-size: var(--fs-12); font-weight: var(--fw-medium); letter-spacing: 0; }
.mh p { color: var(--text-2); margin-top: 2px; }
.mh p.mono { margin-top: 6px; color: var(--text-2); }
.mh .incl { margin-top: 4px; color: var(--text-2); font-size: var(--fs-12); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.mh .incl .chip { height: 22px; padding: 0 8px; background: var(--surface-2); color: var(--text); }
.mh .tools { margin-left: auto; display: flex; gap: var(--sp-2); align-items: center; position: relative; }
.sortbtn.open { background: var(--surface-2); color: var(--text); }
.crumb { display: flex; align-items: center; gap: var(--sp-1); font-size: var(--fs-12); color: var(--text); margin: -8px 0 var(--sp-2); }
.crumb button { color: var(--text-2); }
.crumb button:hover { color: var(--text); }
.crumb .i { color: var(--text-3); }
.active { display: flex; align-items: center; gap: var(--sp-2); margin: -6px 0 var(--sp-4); flex-wrap: wrap; }
.active .lbl { font-size: var(--fs-12); color: var(--text-3); }
.sh { display: flex; align-items: baseline; gap: var(--sp-2); margin: 0 0 var(--sp-3); }
.sh h2 { font-size: var(--fs-15); line-height: var(--lh-15); font-weight: var(--fw-semi); }
.sh .t3 { font-size: var(--fs-12); }
.sh .btn { margin-left: auto; align-self: center; }
.sh .acts { margin-left: auto; display: flex; gap: var(--sp-1); align-self: center; }
.sh .acts .btn { margin-left: 0; }
.sh .btn .i { order: 2; }
.more { font-size: var(--fs-12); color: var(--text-3); margin-top: var(--sp-2); display: flex; align-items: center; gap: var(--sp-3); }
.note-empty { color: var(--text-2); padding: var(--sp-6) 0; display: flex; align-items: center; gap: var(--sp-3); }

/* Menus (card menu, sort, status) */
.menu {
  position: absolute; z-index: 20; width: 200px; padding: 4px; background: var(--surface); border: 1px solid var(--line-strong);
  border-radius: var(--r-sm); box-shadow: var(--el-2); display: flex; flex-direction: column;
}
.menu .mi { display: flex; align-items: center; gap: var(--sp-2); height: 30px; width: 100%; padding: 0 var(--sp-2); border-radius: var(--r-xs); color: var(--text); font-size: var(--fs-12); white-space: nowrap; }
.menu .mi > .i { color: var(--text-2); }
.menu .mi:hover, .menu .mi:focus-visible, .menu .mi.cur { background: var(--surface-2); outline: none; }
.menu .mi .kbd { margin-left: auto; height: 18px; font-size: 10px; }
.menu .mi .n { margin-left: auto; color: var(--text-3); font-variant-numeric: tabular-nums; }
.menu .mi .chk { color: var(--accent); }
.menu .mi .sp4 { width: 14px; flex: none; }
.menu .mi.danger { color: var(--st-rejected); }
.menu .mi .sub-arrow { margin-left: auto; color: var(--text-3); }
.menu .mi.hd { color: var(--text-2); font-weight: var(--fw-medium); }
.menu .sep { flex: none; height: 1px; background: var(--line); margin: 4px 2px; }
.menu .in { display: flex; align-items: center; gap: var(--sp-2); min-height: 30px; padding: 0 var(--sp-2); color: var(--text-2); }
.menu .in input {
  flex: 1; min-width: 0; height: 24px; padding: 0 6px; border: 1px solid var(--focus); border-radius: var(--r-xs); background: var(--bg);
  color: var(--text); font-size: var(--fs-12); outline: none; box-shadow: 0 0 0 2px var(--accent-soft);
}
.menu .in input.err { border-color: var(--st-rejected); box-shadow: 0 0 0 2px var(--st-rejected-soft); }
.menu .in-msg { padding: 0 var(--sp-2) 4px 30px; color: var(--st-rejected); font-size: var(--fs-11); line-height: 14px; white-space: normal; }
.menu.cols { width: 240px; }
.gc .menu.cols { width: 200px; }

/* Idea card */
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--sp-5); }
.gc {
  --well-h: 200px; --sw: 62px; --sh: 134px; --mw: 70px; --mh: 151px; --ww: 220px; --wh: 138px;
  position: relative; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-md); overflow: hidden; transition: box-shadow var(--dur-1) var(--ease-out), border-color var(--dur-1) var(--ease-out);
}
.grid.sm .gc { --well-h: 168px; --sw: 54px; --sh: 117px; --mw: 60px; --mh: 130px; --ww: 180px; --wh: 112px; }
.gc.fresh { animation: fadein var(--dur-2) var(--ease-out); }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

}

<script>
(function () {
  'use strict';
  // Everything a page shows comes from the server's index (the #boot JSON block, then /api/index on
  // live reload). Names and paths are only ever set as text (textContent), never as HTML.
  // The index arrives as data (type="application/json"), never as script
  let BOOT = { projects: [], ideas: [], now: Date.now() / 1000, mode: 'registry' };
  try { const el = document.getElementById('boot'); if (el) BOOT = JSON.parse(el.textContent); } catch (_) {}
  const Q = new URLSearchParams(location.search);
  const $ = (id) => document.getElementById(id);
  const main = $('main'), rail = $('rail'), layer = $('layer');
  const SVGNS = 'http://www.w3.org/2000/svg';
  let M = null;   // management hooks (dashboard-manage.js), absent in share mode

  // ── small DOM helpers ──
  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    if (props) for (const k in props) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'style') el.style.cssText = v;
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : String(v));
    }
    return add(el, kids);
  }
  function add(el, kids) {
    for (const c of kids) {
      if (c == null || c === false) continue;
      if (Array.isArray(c)) add(el, c);
      else el.append(c.nodeType ? c : String(c));
    }
    return el;
  }
  function icon(name, cls) {
    const s = document.createElementNS(SVGNS, 'svg');
    s.setAttribute('class', 'i' + (cls ? ' ' + cls : ''));
    s.setAttribute('aria-hidden', 'true');
    const u = document.createElementNS(SVGNS, 'use');
    u.setAttribute('href', '#i-' + name);
    s.append(u);
    return s;
  }
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} },
  };
  const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
  // A path or name as one shell word; a leading ~/ stays outside the quotes so the shell expands it
  function shq(s) {
    s = String(s);
    const q = (t) => (/^[A-Za-z0-9_.\/@%+=:,-]+$/.test(t) ? t : "'" + t.replace(/'/g, "'\\''") + "'");
    if (s === '~') return s;
    if (s.startsWith('~/')) return s.length > 2 ? '~/' + q(s.slice(2)) : s;
    return s ? q(s) : "''";
  }
  const both = (long, short) => [h('span', { class: 'ph-hide', text: long }), h('span', { class: 'ph-only', text: short })];

  // ── time ──
  let skew = 0;   // server clock minus this clock (a phone in share mode may differ)
  const nowSec = () => Date.now() / 1000 + skew;
  function ago(t, short) {
    const s = nowSec() - t;
    if (s < 60) return 'Just now';
    const m = Math.floor(s / 60);
    if (m < 60) return m + (short ? ' min' : ' min ago');
    const d0 = new Date((nowSec()) * 1000); d0.setHours(0, 0, 0, 0);
    const today = d0.getTime() / 1000;
    if (t >= today) return Math.floor(m / 60) + (short ? ' h' : ' h ago');
    if (t >= today - 86400) return 'Yesterday';
    const days = Math.ceil((today - t) / 86400);
    if (days < 7) return days + (short ? ' days' : ' days ago');
    return new Date(t * 1000).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  // ── data ──
  const FILTERS = [
    { k: 'draft', url: 'needs-decision', label: 'Needs decision', idea: (x) => x.w > 0, board: (b) => b.s === 'draft',
      ideasSub: 'with undecided boards', boardsSub: 'undecided boards' },
    { k: 'comment', url: 'has-comments', label: 'Has comments', idea: (x) => x.c > 0, board: (b) => b.c > 0,
      ideasSub: 'with open comments', boardsSub: 'boards with comments' },
    { k: 'approved', url: 'approved-not-built', label: 'Approved, not built', idea: (x) => x.apNB, board: (b) => b.s === 'approved' && !b.b,
      ideasSub: 'with approved boards not built yet', boardsSub: 'approved boards not built yet' },
    { k: 'built', url: 'built', label: 'Built', idea: (x) => x.bu > 0, board: (b) => !!b.b,
      ideasSub: 'with built boards', boardsSub: 'built boards' },
  ];
  const BSTATUS = [['any', 'Any status'], ['draft', 'Draft'], ['approved', 'Approved'], ['rejected', 'Rejected'], ['comment', 'Comments'], ['built', 'Built']];
  const bStatusOk = { any: () => true, draft: (b) => b.s === 'draft', approved: (b) => b.s === 'approved',
    rejected: (b) => b.s === 'rejected', comment: (b) => b.c > 0, built: (b) => !!b.b };
  let DATA = BOOT, PROJ = [], IDEAS = [], COLS = [], COL_OF = {};
  const isWeb = (b) => b.w > b.h * 1.2;
  function splitTitle(t) {
    const m = /^((?:[A-Za-z]{1,3}-)?[A-Za-z]{0,3}\d+[A-Za-z]?)[-_ ]+(.+)$/.exec(t);
    const rest = m ? m[2] : t;
    return { id: m ? m[1] : '', name: rest.replace(/[-_]+/g, ' ').replace(/([a-z])([A-Z])/g, '$1 $2') };
  }
  function lastVisit(vk) {
    if (HOOK.visited !== null) return Date.now() - (parseFloat(HOOK.visited) || 0) * 60000;
    const v = parseFloat(store.get('mc:visit:' + vk));
    return isFinite(v) ? v : 0;
  }
  function prep(d) {
    DATA = d;
    skew = (d.now || Date.now() / 1000) - Date.now() / 1000;
    if (Math.abs(skew) < 5) skew = 0;
    const latest = {};   // projects: most recently edited first, missing folders last
    for (const x of d.ideas || []) latest[x.project] = Math.max(latest[x.project] || 0, x.mtime);
    PROJ = (d.projects || []).filter((p) => !p.missing).sort((a, b) => (latest[b.name] || 0) - (latest[a.name] || 0))
      .concat((d.projects || []).filter((p) => p.missing));
    // Collections: a key is "project" (the whole project) or "project/idea"; the idea key wins
    COL_OF = {};
    const raw = d.collections && typeof d.collections === 'object' ? d.collections : {};
    for (const n of Object.keys(raw)) if (Array.isArray(raw[n])) for (const k of raw[n]) if (typeof k === 'string' && !(k in COL_OF)) COL_OF[k] = n;
    IDEAS = (d.ideas || []).map((x) => {
      let a = 0, w = 0, r = 0, c = 0, bu = 0, apNB = false;
      for (const b of x.boards) {
        b.idea = x;
        if (b.s === 'approved') { a++; if (!b.b) apNB = true; } else if (b.s === 'rejected') r++; else w++;
        c += b.c; bu += b.b;
      }
      const vk = x.url.replace(/^\/+|\/+$/g, '');
      const last = lastVisit(vk);
      return Object.assign(x, {
        a, w, r, c, bu, apNB, vk,
        key: d.mode === 'single' ? x.name : x.project + '/' + x.name,
        col: COL_OF[x.project + '/' + x.name] || COL_OF[x.project] || null,
        colWhole: !COL_OF[x.project + '/' + x.name] && !!COL_OF[x.project],
        sorted: x.boards.slice().sort((p, q) => q.m - p.m),
        newN: last ? x.boards.filter((b) => b.m * 1000 > last).length : 0,
      });
    });
    // Shown when it holds an idea or a whole registered project; keys of projects no longer in the list are ignored
    const live = new Set(PROJ.filter((p) => !p.missing).map((p) => p.name));
    COLS = Object.keys(raw).map((name) => ({ name, n: IDEAS.filter((x) => x.col === name).length,
      wholes: Object.keys(COL_OF).filter((k) => COL_OF[k] === name && live.has(k)) }))
      .filter((c) => c.n || c.wholes.length).sort((a, b) => a.name.localeCompare(b.name));
  }
  const colItems = (c) => IDEAS.filter((x) => x.col === c.name);
  function andList(xs) {
    return xs.length < 3 ? xs.join(' and ') : xs.slice(0, -1).join(', ') + ', and ' + xs[xs.length - 1];
  }
  const isEmpty = () => HOOK.state === 'empty' || !PROJ.length;
  function sortIdeas(xs) {
    const s = xs.slice();
    if (ST.sort === 'name') s.sort((a, b) => a.name.localeCompare(b.name));
    else if (ST.sort === 'boards') s.sort((a, b) => b.boards.length - a.boards.length || b.mtime - a.mtime);
    else s.sort((a, b) => b.mtime - a.mtime);
    return s;
  }
  const bMatch = (b, q) => !q || b.f.toLowerCase().includes(q) || b.t.toLowerCase().includes(q) || b.n.toLowerCase().includes(q);
  const thumbUrl = (x, b) => x.url + 'thumbs/' + encodeURIComponent(b.f.replace(/\.html$/, '')) + '.png?s=0.4';
  const boardUrl = (b) => b.idea.url + '#' + encodeURIComponent(b.f.replace(/\.html$/, ''));
  const abs = (u) => location.origin + u;

  // ── state (kept in the URL so reload and Back work) ──
  const HOOK = {   // one-shot states for deterministic screenshots, see the README
    palette: Q.get('palette'), add: Q.get('add'), menu: Q.get('menu'), hover: Q.get('hover'), focus: Q.get('focus'),
    state: Q.get('state'), sortmenu: Q.get('sortmenu') === '1', demo: Q.get('demo'), visited: Q.get('visited'),
  };
  const ST = { project: 'all', col: null, filter: null, q: '', view: 'large', sort: 'recent', page: 'ideas', bIdea: 'all', bStatus: 'any', bLimit: 48, fLimit: 16 };
  function readUrl(p) {
    ST.project = p.get('project') || 'all';
    ST.col = ST.project === 'all' ? p.get('col') || null : null;
    const f = FILTERS.find((f) => f.url === p.get('filter'));
    ST.filter = f ? f.k : null;
    ST.q = p.get('q') || '';
    ST.page = p.get('page') === 'boards' ? 'boards' : 'ideas';
    ST.bIdea = p.get('idea') || 'all';
    ST.bStatus = bStatusOk[p.get('bstatus')] ? p.get('bstatus') : 'any';
    ST.sort = ['name', 'boards'].includes(p.get('sort')) ? p.get('sort') : 'recent';
    const v = p.get('view') || store.get('mc:view');
    ST.view = v === 'compact' ? 'compact' : 'large';
    ST.bLimit = 48; ST.fLimit = 16;
  }
  function writeUrl(push) {
    const p = new URLSearchParams();
    if (ST.project !== 'all') p.set('project', ST.project);
    else if (ST.col) p.set('col', ST.col);
    if (ST.page === 'boards') {
      p.set('page', 'boards');
      if (ST.bIdea !== 'all') p.set('idea', ST.bIdea);
      if (ST.bStatus !== 'any') p.set('bstatus', ST.bStatus);
    }
    if (ST.filter) p.set('filter', FILTERS.find((f) => f.k === ST.filter).url);
    if (ST.q) p.set('q', ST.q);
    if (ST.sort !== 'recent') p.set('sort', ST.sort);
    const s = p.toString();
    const url = location.pathname + (s ? '?' + s : '');
    if (url !== location.pathname + location.search) history[push ? 'pushState' : 'replaceState'](null, '', url);
  }
  function go(changes, push) {
    closeMenu();
    Object.assign(ST, changes);
    if (!('bLimit' in changes)) ST.bLimit = 48;
    if (!('fLimit' in changes)) ST.fLimit = 16;
    writeUrl(push);
    render();
    main.scrollTop = 0;
  }

  // ── thumbnails: fetched lazily, a few at a time, retried while the server renders ──
  const Thumbs = (() => {
    const E = new Map(), queue = [];
    const BACKOFF = [1000, 2000, 4000, 8000, 16000, 30000];

    if (!g) return;
    const other = list.find((x) => x !== g) || g;
    const best = list.slice().sort((a, b) => (b.a / Math.max(1, b.boards.length)) - (a.a / Math.max(1, a.boards.length)))[0];
    const empty = Object.assign({}, g, { name: 'habits-v2', boards: [], sorted: [], a: 0, w: 0, r: 0, c: 0, bu: 0, newN: 0, mtime: nowSec() - 60 });
    const cells = [
      ['Default', '3 most recently edited boards', card(g, { newN: 0, static: true })],
      ['Hover', 'Thumbnails dim, quick actions appear', card(g, { newN: 0, hover: true })],
      ['Keyboard focus', '2 px ring in --focus; Enter opens', card(g, { newN: 0, focus: true, static: true })],
      ['Changed and waiting', 'Badge: boards edited since last visit', card(other, { newN: other.newN || 6, static: true })],
      ['All approved', 'Full green meter and built count', card(best, { newN: 0, static: true })],
      ['Thumbnails pending', 'Thumb endpoint answered 202; shimmer until ready', card(list[list.length - 1] || g, { newN: 0, pending: 1, static: true })],
      ['Thumbnail failed', 'Board did not render; Retry asks again', card(list[Math.min(5, list.length - 1)] || g, { newN: 0, failed: true, static: true })],
      ['No boards yet', 'Idea folder with an empty canvas.json', card(empty, { static: true })],
    ];
    main.append(h('div', { class: 'demo' },
      h('div', { class: 'hd' }, h('h1', { text: 'Idea card states' }), h('p', { text: 'One component, every state the gallery can show. Card width 300 to 340 px.' })),
      h('div', { class: 'grid' }, cells.map(([t, d, c]) => h('div', { class: 'cell' }, h('p', { class: 'cap' }, h('b', { text: t }), h('span', { text: d })), c)))));
  }

  // ── command palette ──
  function openPalette(initial) {
    let rows = [], cur = 0;
    const input = h('input', { type: 'text', placeholder: 'Jump to an idea or board, or run a command', autocomplete: 'off',
      spellcheck: 'false', role: 'combobox', 'aria-expanded': 'true', 'aria-controls': 'pal-res', 'aria-label': 'Search ideas, boards, and actions' });
    const cnt = h('span', { class: 'cnt', 'aria-live': 'polite' });
    const res = h('div', { class: 'res', id: 'pal-res', role: 'listbox', 'aria-label': 'Results' });
    const foot = h('div', { class: 'pf' }, ...[[['↑', '↓'], 'Move'], [['↵'], 'Open'], [['⌘↵'], 'Open in new tab'], [['esc'], 'Close']]
      .map(([ks, l]) => h('span', { class: 'k' }, ks.map((k) => h('span', { class: 'kbd', text: k })), l)));
    const dlg = h('div', { class: 'dialog pal', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Command palette' },
      h('div', { class: 'grab' }),
      h('div', { class: 'pin' }, icon('search'), input, cnt, h('span', { class: 'kbd', text: 'esc' }),
        h('button', { class: 'icon-btn clr', type: 'button', 'aria-label': 'Clear', onclick: () => { input.value = ''; update(); input.focus(); } }, icon('x'))),
      res, foot);
    openLayer([h('div', { class: 'scrim', onclick: closeLayer }), dlg]);
    function actions() {
      const out = (M ? M.paletteActions() : []).concat([
        { icon: 'filter', label: 'Show ideas that need a decision', run: () => go({ filter: 'draft', q: '', page: 'ideas' }) },
        { icon: theme() === 'light' ? 'moon' : 'sun', label: 'Switch to ' + (theme() === 'light' ? 'dark' : 'light') + ' theme', kbd: '⇧T', run: toggleTheme },
      ]);
      return out;
    }
    function ideaRow(x, q) {
      const b = x.sorted[0];
      return { kind: 'idea', url: x.url, run: () => { location.href = x.url; },
        el: h('li', { role: 'option' }, thumbEl(x, b), h('span', { class: 'lt' }, hl(x.name, q)),
          h('span', { class: 'x', text: x.project + ', ' + plural(x.boards.length, 'board') + ', ' + ago(x.mtime) }), h('span', { class: 'kbd kb', text: '↵' })) };
    }
    function boardRow(b, q) {
      const t = splitTitle(b.t);
      return { kind: 'board', url: boardUrl(b), run: () => { location.href = boardUrl(b); },
        el: h('li', { role: 'option' }, thumbEl(b.idea, b), h('span', { class: 'lt' }, t.id ? [h('span', { class: 'mono', text: t.id }), ' '] : null, hl(t.name, q)),
          h('span', { class: 'x', text: b.idea.name }), boardPill(b)) };
    }
    function actionRow(a, q) {
      return { kind: 'action', run: a.run, el: h('li', { role: 'option' }, icon(a.icon), h('span', { class: 'lt' }, hl(a.label, q)),
        h('span', { class: 'x', text: a.hint || '' }), a.kbd ? h('span', { class: 'kbd', text: a.kbd }) : null) };
    }
    function thumbEl(x, b) {
      const img = h('img', { class: 'pth' + (b && isWeb(b) ? ' web' : ''), alt: '' });
      if (b) Thumbs.peek(thumbUrl(x, b)).then((src) => { if (src) img.src = src; });
      return img;
    }
    function group(title, list) {
      if (!list.length) return;
      res.append(h('p', { class: 'grp', text: title }));
      const ul = h('ul');
      for (const r of list) { ul.append(r.el); rows.push(r); }
      res.append(ul);
    }
    function update() {
      const raw = input.value.trim(), q = raw.toLowerCase();
      res.textContent = '';
      rows = [];
      cur = 0;
      if (!q) {
        cnt.textContent = '';
        const ideas = sortIdeas(IDEAS).slice(0, 3);
        const boards = [].concat(...IDEAS.map((x) => x.boards)).sort((a, b) => b.m - a.m).slice(0, 2);
        group('Recent ideas', ideas.map((x) => ideaRow(x, '')));
        group('Recent boards', boards.map((b) => boardRow(b, '')));
        group('Actions', actions().map((a) => actionRow(a, '')));
      } else {
        const ideas = sortIdeas(IDEAS.filter((x) => x.name.toLowerCase().includes(q) || x.project.toLowerCase().includes(q)));
        const boards = [].concat(...IDEAS.map((x) => x.boards.filter((b) => bMatch(b, q)))).sort((a, b) => b.m - a.m);
        const acts = actions().filter((a) => a.label.toLowerCase().includes(q));
        if (!ideas.length && !boards.length && !acts.length) {
          cnt.textContent = '';
          res.append(h('div', { class: 'none' },
            h('div', { class: 'ni' }, icon('search', 'lg')),
            h('h2', { text: 'Nothing matches "' + raw + '"' }),
            h('p', { text: M ? 'No idea, board, or action has that name. If the idea lives in a folder you have not added yet, add it.'
              : 'No idea, board, or action has that name.' }),
            h('div', { class: 'acts' }, M ? M.noResultsActions() : null,
              h('button', { class: 'btn ghost', type: 'button', onclick: () => { input.value = ''; update(); input.focus(); } }, 'Clear search'))));
          return;
        }
        acts.push({ icon: 'filter', label: 'Filter the gallery by "' + raw + '"', hint: 'Shows ideas and boards in the page',
          run: () => go({ q: raw, page: 'ideas' }) });
        const n = ideas.length + boards.length + acts.length;
        cnt.textContent = plural(n, 'result');
        group('Ideas', ideas.slice(0, 5).map((x) => ideaRow(x, q)));
        group('Boards', boards.slice(0, 8).map((b) => boardRow(b, q)));
        group('Actions', acts.map((a) => actionRow(a, q)));
      }
      rows.forEach((r, i) => {
        r.el.id = 'pal-o' + i;
        r.el.addEventListener('mousemove', () => select(i));
        r.el.addEventListener('click', (e) => run(i, e.metaKey || e.ctrlKey));
      });
      select(0);
    }
    function select(i) {
      if (!rows.length) { input.removeAttribute('aria-activedescendant'); return; }
      cur = (i + rows.length) % rows.length;
      rows.forEach((r, j) => { r.el.classList.toggle('on', j === cur); r.el.setAttribute('aria-selected', String(j === cur)); });
      input.setAttribute('aria-activedescendant', rows[cur].el.id);
      rows[cur].el.scrollIntoView({ block: 'nearest' });
    }
    function run(i, newTab) {
      const r = rows[i];
      if (!r) return;
      if (newTab && r.url) { openTab(r.url); return; }
      closeLayer();
      r.run();
    }
    input.addEventListener('input', update);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') { e.preventDefault(); select(cur + 1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); select(cur - 1); }
      else if (e.key === 'Enter') { e.preventDefault(); run(cur, e.metaKey || e.ctrlKey); }
      else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeLayer(); }
    });
    dlg.addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.preventDefault(); closeLayer(); } });
    input.value = initial || '';
    update();
    input.focus();
  }

  // ── keyboard ──
  function gridNav(e, link) {
    const box = link.closest('.grid, .tiles');
    if (!box) return;
    const links = [...box.children].map((c) => (c.matches('a') ? c : c.querySelector('a.cl'))).filter(Boolean);
    const i = links.indexOf(link);
    if (i < 0) return;
    const top0 = box.children[0].offsetTop;
    let cols = 0;
    for (const c of box.children) { if (c.offsetTop !== top0) break; cols++; }
    const step = { ArrowRight: 1, j: 1, ArrowLeft: -1, k: -1, ArrowDown: cols, ArrowUp: -cols }[e.key];
    const n = links[i + step];
    if (step && n) { e.preventDefault(); n.focus(); n.scrollIntoView({ block: 'nearest' }); }
  }
  document.addEventListener('keydown', (e) => {
    if (layer.childElementCount) return;   // the palette and dialogs handle their own keys
    const t = e.target;
    const typing = t.closest && t.closest('input, textarea, select, [contenteditable]');
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(''); return; }
    if (typing) return;
    if (e.key === '/' && !e.metaKey && !e.ctrlKey && !e.altKey) { e.preventDefault(); openPalette(''); return; }
    if (e.key === 'T' && e.shiftKey && !e.metaKey && !e.ctrlKey && !e.altKey) { e.preventDefault(); toggleTheme(); return; }
    if (e.key === 'Escape') { if (openMenu) closeMenu(true); else if (ST.q) go({ q: '' }); return; }
    if (t.matches && t.matches('a.cl, a.tile')) {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); openTab(t.getAttribute('href')); return; }
      if (!e.metaKey && !e.ctrlKey && !e.altKey) gridNav(e, t);
    }
  });

  // ── live reload ──
  let refreshT = 0, pending = null;
  async function refresh(now) {
    let d;
    try {
      const r = await fetch('/api/index', { cache: 'no-store', credentials: 'same-origin' });
      if (!r.ok) return;
      d = await r.json();
    } catch (_) { return; }
    pending = d;
    apply(now);
  }
  function busy() {
    const a = document.activeElement;
    return layer.childElementCount || openMenu || main.querySelector('.gc:hover, .tile:hover') ||
      (a && a !== main && main.contains(a));
  }
  function apply(now) {
    if (!pending) return;
    if (!now && busy()) { clearTimeout(refreshT); refreshT = setTimeout(() => apply(false), 1000); return; }   // nothing moves under the pointer
    const before = new Map(IDEAS.map((x) => [x.key, x.newN]));
    prep(pending);
    pending = null;
    render(true);
    for (const el of main.querySelectorAll('.gc')) {
      const x = el._x, nb = el.querySelector('.new');
      if (x && nb && x.newN > (before.get(x.key) || 0)) nb.classList.add('pop');
    }
  }
  function connect() {
    let es;
    try { es = new EventSource('/api/events'); } catch (_) { return; }
    es.onmessage = (ev) => {
      let d;
      try { d = JSON.parse(ev.data); } catch (_) { return; }
      if (d.type === 'thumb' && d.file) Thumbs.ready(d.key, d.file);
      else if (d.type === 'board' || d.type === 'canvas') { clearTimeout(refreshT); refreshT = setTimeout(() => refresh(false), 400); }
    };
    es.onerror = () => { es.close(); setTimeout(connect, 3000); };
  }

  function render(keep) { renderTop(); renderRail(); renderMain(keep); }

  window.MC = { h, icon, plural, both, shq, toast, copy, openTab, go, refresh, render, openLayer, closeLayer,
    buildMenu, showMenu, closeMenu, swapMenu, get menu() { return openMenu ? openMenu.menu : null; },
    get data() { return DATA; }, get state() { return ST; }, get collections() { return COLS; }, collectionOf: (key) => COL_OF[key] || null };

  function start() {
    M = window.MC_MANAGE || null;
    readUrl(Q);
    prep(BOOT);
    if (M && M.topbar) add($('tb-manage'), M.topbar());
    $('tb-search').addEventListener('click', () => openPalette(ST.q));
    $('theme').addEventListener('click', toggleTheme);
    renderBanner();
    render();
    if (HOOK.palette !== null) openPalette(HOOK.palette);
    else if (HOOK.add !== null && M) M.openAdd({ path: HOOK.add });
    else if (HOOK.sortmenu) { const b = main.querySelector('.mh .sortbtn'); if (b) openSortMenu(b); }
    else if (HOOK.menu) {
      const el = [...main.querySelectorAll('.gc')].find((c) => c._x && c._x.name === HOOK.menu);
      if (el) openCardMenu(el._x, el, el.querySelector('.ovm'));
    }
    window.addEventListener('popstate', () => { readUrl(new URLSearchParams(location.search)); render(); });
    window.addEventListener('pageshow', (e) => { if (e.persisted) { prep(DATA); render(true); refresh(false); } });   // back from a canvas: new counts
    connect();
  }
  document.addEventListener('DOMContentLoaded', start);
})();
</script>
